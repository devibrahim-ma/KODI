    // Web Audio API Sound Synthesizer (Zero external audio file latency)
    const playAudioFeedback = (type) => {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();

        if (type === 'success') {
          // Energetic positive double chime (High notes)
          const now = ctx.currentTime;
          const osc1 = ctx.createOscillator();
          const gain1 = ctx.createGain();
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(587.33, now); // D5
          osc1.frequency.exponentialRampToValueAtTime(880, now + 0.12); // A5
          gain1.gain.setValueAtTime(0.25, now);
          gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
          osc1.connect(gain1);
          gain1.connect(ctx.destination);
          osc1.start(now);
          osc1.stop(now + 0.25);

          const osc2 = ctx.createOscillator();
          const gain2 = ctx.createGain();
          osc2.type = 'triangle';
          osc2.frequency.setValueAtTime(880, now + 0.12);
          osc2.frequency.exponentialRampToValueAtTime(1174.66, now + 0.35); // D6
          gain2.gain.setValueAtTime(0.2, now + 0.12);
          gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
          osc2.connect(gain2);
          gain2.connect(ctx.destination);
          osc2.start(now + 0.12);
          osc2.stop(now + 0.4);
        } else if (type === 'duplicate' || type === 'error') {
          // Warning low buzz sound
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.setValueAtTime(180, now + 0.12);
          gain.gain.setValueAtTime(0.35, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.4);
        } else if (type === 'beep') {
          // Simple scan click
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1046.5, now); // C6
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.08);
        }
      } catch (e) {
        console.warn('Audio feedback error', e);
      }
    };

      const [currentView, setCurrentView] = useState('scan'); // 'scan' | 'summary' | 'quick-list'

      const [inputCode, setInputCode] = useState('');

        // Pre-populate with 2 checked-in kids for realistic initial demo look

      // Feedback state for current scan
      const [feedback, setFeedback] = useState(null); 
      // feedback shape: { status: 'success' | 'duplicate' | 'not_found', minor, timestamp, message, previousTime }

      const [screenFlash, setScreenFlash] = useState(null); // 'green' | 'red'
      const [autoFocusEnabled, setAutoFocusEnabled] = useState(true);
      const [currentTimeStr, setCurrentTimeStr] = useState('');
      const [showDemoSelector, setShowDemoSelector] = useState(false);

      const inputRef = useRef(null);

      // Keep focus on input for hardware bluetooth barcode readers
      useEffect(() => {
        if (autoFocusEnabled && currentView === 'scan') {
          const timer = setTimeout(() => {
            if (inputRef.current) {
              inputRef.current.focus();
            }
          }, 150);
          return () => clearTimeout(timer);
        }
      }, [autoFocusEnabled, currentView, feedback]);

      // Live digital clock
      useEffect(() => {
        const updateClock = () => {
          const now = new Date();
          setCurrentTimeStr(now.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
        };
        updateClock();
        const interval = setInterval(updateClock, 1000);
        return () => clearInterval(interval);
      }, []);

      // Calculate stats for current mode
      const activeRecords = records[currentMode] || {};
      const registeredCount = Object.keys(activeRecords).length;
      const totalCount = minors.length;
      const percentage = Math.round((registeredCount / totalCount) * 100) || 0;

      // Handle barcode or ID submission
      const processScan = (rawCode) => {
        const code = (rawCode || '').trim().toUpperCase();
        if (!code) return;

        playAudioFeedback('beep');

        // Search minor by ID, Wristband or exact/partial name
        const found = minors.find(m => 
          m.id.toUpperCase() === code ||
          m.wristband.toUpperCase() === code ||
          m.name.toUpperCase().includes(code)
        );

        const now = new Date();
        const timestampStr = now.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

        if (!found) {
          // Not found feedback
          playAudioFeedback('error');
          triggerHaptic([150, 100, 150]);
          setScreenFlash('red');
          setFeedback({
            status: 'not_found',
            code,
            timestamp: timestampStr,
            message: `Código no reconocido: "${code}"`
          });
          setTimeout(() => setScreenFlash(null), 500);
          setInputCode('');
          return;
        }

        // Check if already registered in current mode
        const previousRecord = activeRecords[found.id];

        if (previousRecord) {
          // DUPLICATE ATTEMPT!
          playAudioFeedback('duplicate');
          triggerHaptic([300, 100, 300]);
          setScreenFlash('red');
          setFeedback({
            status: 'duplicate',
            minor: found,
            timestamp: timestampStr,
            previousTime: previousRecord.timestamp,
            message: '¡ALERTA: Este menor ya ha fichado!'
          });
          setTimeout(() => setScreenFlash(null), 600);
        } else {
          // SUCCESSFUL SCAN!
          playAudioFeedback('success');
          triggerHaptic([120]);
          setScreenFlash('green');

          // Save to records
          setRecords(prev => ({
            ...prev,
            [currentMode]: {
              ...prev[currentMode],
              [found.id]: {
                timestamp: timestampStr,
                mode: currentMode
              }
            }
          }));

          setFeedback({
            status: 'success',
            minor: found,
            timestamp: timestampStr,
            message: currentMode === 'moviles' ? 'Móvil entregado / verificado' : 'Acceso registrado correctamente'
          });
          setTimeout(() => setScreenFlash(null), 600);
        }

        setInputCode('');
        
        // Auto focus back for gun
        setTimeout(() => {
          if (inputRef.current) inputRef.current.focus();
        }, 100);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        processScan(inputCode);
      };

      const resetCurrentSession = () => {
        if (confirm(`¿Reiniciar registros de ${MODES.find(m => m.id === currentMode)?.label}?`)) {
          setRecords(prev => ({
            ...prev,
            [currentMode]: {}
          }));
          setFeedback(null);
        }
      };

      const toggleManualMinor = (minorId) => {
        const isRegistered = !!activeRecords[minorId];
        const now = new Date();
        const timestampStr = now.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

        if (isRegistered) {
          setRecords(prev => {
            const copy = { ...prev[currentMode] };
            delete copy[minorId];
            return { ...prev, [currentMode]: copy };
          });
        } else {
          setRecords(prev => ({
            ...prev,
            [currentMode]: {
              ...prev[currentMode],
              [minorId]: { timestamp: timestampStr, mode: currentMode }
            }
          }));
          playAudioFeedback('success');
        }
      };

      return (
        <div className={`min-h-screen flex flex-col justify-between max-w-md mx-auto relative transition-colors duration-300 ${

                <div>

                    CampCheck <span className="text-[10px] font-semibold tracking-wider uppercase px-1.5 py-0.5 rounded bg-brand-500/20 text-brand-400 border border-brand-500/30">KODI</span>
                  </h1>
                  <p className="text-[11px] text-slate-400">Kontrol Dinámico Infantil</p>
                </div>
              </div>

              <div className="text-right">
                <div className="text-xs font-mono font-bold text-slate-300 bg-slate-800/80 px-2 py-0.5 rounded-md border border-slate-700/60 inline-flex items-center gap-1.5">

              </div>

            {/* MODES SWITCHER TABS */}

                <span className="text-[11px] font-bold text-slate-300 font-mono">{percentage}%</span>

                      }`}
                    >
                      {autoFocusEnabled ? '● Auto-foco ON (Pistola)' : '○ Foco Manual'}
                    </button>
                  </div>

                  <form onSubmit={handleSubmit} className="relative">
                    <div className="relative flex items-center">
                      <input
                        ref={inputRef}
                        type="text"
                        value={inputCode}
                        onChange={(e) => setInputCode(e.target.value)}
                        placeholder="Escanear pulsera o teclear ID..."
                        className="w-full bg-slate-950 border-2 border-slate-700 focus:border-brand-500 focus:ring-4 focus:ring-brand-500/20 text-white font-mono text-base px-4 py-3.5 rounded-xl outline-none placeholder:text-slate-500 transition-all tracking-wide"
                        autoComplete="off"
                        autoCapitalize="characters"
                        spellCheck="false"
                      />
                      
                      {inputCode && (
                        <button
                          type="button"
                          onClick={() => setInputCode('')}
                          className="absolute right-24 text-slate-400 hover:text-white p-1 text-sm"
                        >
                          ✕
                        </button>
                      )}

                      <button
                        type="submit"
                        className="absolute right-1.5 bg-brand-600 hover:bg-brand-500 text-white font-bold text-xs uppercase tracking-wider px-4 py-2.5 rounded-lg active:scale-95 transition-all shadow-md flex items-center gap-1.5"
                      >
                        <span>Escanear</span>
                        <span>➔</span>
                      </button>
                    </div>
                  </form>

                  {/* QUICK DEMO KIDS SELECTOR ACCORDION / TOGGLE */}
                  <div className="mt-3 pt-2.5 border-t border-slate-800/80">
                    <div className="flex items-center justify-between">
                      <span className="text-[11px] font-semibold text-slate-400">
                        🧪 Menores de prueba para demo táctil:
                      </span>
                      <button
                        type="button"
                        onClick={() => setShowDemoSelector(!showDemoSelector)}
                        className="text-[11px] font-bold text-brand-400 hover:text-brand-300 py-0.5 px-2 rounded bg-slate-800/80"
                      >
                        {showDemoSelector ? 'Ocultar lista ▲' : 'Ver todos (15) ▼'}
                      </button>
                    </div>

                    {/* Quick tap chips (Always show 3 high-impact samples: 1 Celiac, 1 Normal, 1 Halal) */}
                    <div className="grid grid-cols-3 gap-1.5 mt-2">
                      <button
                        type="button"
                        onClick={() => processScan('ID-001')}
                        className="p-2 rounded-xl bg-slate-950/90 border border-amber-500/40 hover:border-amber-400 text-left transition-all active:scale-95 group"
                      >
                        <div className="text-[10px] font-mono font-bold text-amber-400 truncate">ID-001 (🌾 Celíaco)</div>
                        <div className="text-xs font-bold text-slate-200 truncate">Juan Pérez</div>
                        <div className="text-[9px] text-slate-400 mt-0.5">🌾 Sin gluten</div>
                      </button>

                      <button
                        type="button"
                        onClick={() => processScan('ID-002')}
                        className="p-2 rounded-xl bg-slate-950/90 border border-slate-700/80 hover:border-slate-500 text-left transition-all active:scale-95"
                      >
                        <div className="text-[10px] font-mono font-bold text-slate-400 truncate">ID-002 (Sin Alergia)</div>
                        <div className="text-xs font-bold text-slate-200 truncate">Sofía Gómez</div>
                        <div className="text-[9px] text-emerald-400 mt-0.5">✓ Menú estándar</div>
                      </button>

                      <button
                        type="button"
                        onClick={() => processScan('ID-004')}
                        className="p-2 rounded-xl bg-slate-950/90 border border-rose-500/40 hover:border-rose-400 text-left transition-all active:scale-95"
                      >
                        <div className="text-[10px] font-mono font-bold text-rose-400 truncate">ID-004 (🥜 Crítico)</div>
                        <div className="text-xs font-bold text-slate-200 truncate">Lucas Silva</div>
                        <div className="text-[9px] text-rose-400 mt-0.5">⚠️ EpiPen</div>
                      </button>
                    </div>

                    {/* Extended list when expanded */}
                    {showDemoSelector && (
                      <div className="mt-2.5 max-h-48 overflow-y-auto space-y-1 pr-1 bg-slate-950/60 p-2 rounded-xl border border-slate-800">
                        {minors.map((kid) => {
                          const isAlready = !!activeRecords[kid.id];
                          return (
                            <button
                              key={kid.id}
                              type="button"
                              onClick={() => {
                                processScan(kid.id);
                              }}
                              className={`w-full flex items-center justify-between p-2 rounded-lg text-left text-xs transition-colors ${
                                isAlready
                                  ? 'bg-slate-900/40 text-slate-500 hover:bg-slate-800'
                                  : 'bg-slate-900/90 hover:bg-slate-800 text-slate-200 border border-slate-800/80'
                              }`}
                            >
                              <div className="flex items-center space-x-2 truncate">
                                <span>{kid.avatar}</span>
                                <div className="truncate">
                                  <span className="font-mono font-bold text-brand-300 text-[11px] mr-1.5">{kid.id}</span>
                                  <span className="font-semibold">{kid.name}</span>
                                </div>
                              </div>

                              <div className="flex items-center space-x-1.5 flex-shrink-0">
                                {kid.medical && (
                                  <span className="text-[9px] px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-300 font-bold border border-amber-500/30">
                                    {kid.medical.title.split(' ')[0]}
                                  </span>
                                )}
                                {isAlready ? (
                                  <span className="text-[10px] text-emerald-400 font-bold">✓ Fichado</span>
                                ) : (
                                  <span className="text-[10px] text-slate-400 bg-slate-800 px-1.5 py-0.5 rounded">Tocar ➔</span>
                                )}
                              </div>
                            </button>
                          );
                        })}
                      </div>
                    )}
                  </div>
                </div>

                {/* DYNAMIC FEEDBACK SCREEN / CARD */}
                {feedback ? (
                  <div className={`rounded-2xl border-2 p-4 shadow-2xl transition-all duration-300 transform scale-100 ${
                    feedback.status === 'success' 
                      ? 'bg-gradient-to-b from-emerald-950/90 to-slate-900 border-emerald-500 shadow-emerald-950/50' 
                      : feedback.status === 'duplicate'
                      ? 'bg-gradient-to-b from-rose-950/95 to-slate-900 border-rose-500 shadow-rose-950/50 animate-bounce-short'
                      : 'bg-gradient-to-b from-amber-950/90 to-slate-900 border-amber-500 shadow-amber-950/50'
                  }`}>
                    
                    {/* FEEDBACK STATUS BANNER */}
                    <div className="flex items-start justify-between">
                      <div className="flex items-center space-x-2.5">
                        <div className={`w-10 h-10 rounded-full flex items-center justify-center text-xl font-bold shadow-lg ${
                          feedback.status === 'success'
                            ? 'bg-emerald-500 text-slate-950 ring-4 ring-emerald-500/30'
                            : feedback.status === 'duplicate'
                            ? 'bg-rose-500 text-white ring-4 ring-rose-500/30 animate-pulse'
                            : 'bg-amber-500 text-slate-950 ring-4 ring-amber-500/30'
                        }`}>
                          {feedback.status === 'success' ? '✓' : '⚠️'}
                        </div>
                        <div>
                          <span className={`text-[11px] font-extrabold uppercase tracking-widest ${
                            feedback.status === 'success' ? 'text-emerald-400' : 'text-rose-400'
                          }`}>
                            {feedback.status === 'success' ? 'Registro Correcto' : 'Aviso de Acceso'}
                          </span>
                          <h3 className="text-base font-black text-white leading-tight">
                            {feedback.message}
                          </h3>
                        </div>
                      </div>

                      {/* Close button */}
                      <button
                        onClick={() => setFeedback(null)}
                        className="text-slate-400 hover:text-white p-1 rounded-lg bg-white/5"
                      >
                        ✕
                      </button>
                    </div>

                    {/* DUPLICATE WARNING BOX */}
                    {feedback.status === 'duplicate' && feedback.previousTime && (
                      <div className="mt-3 p-3 bg-rose-500/20 border border-rose-500/50 rounded-xl text-center">
                        <p className="text-xs text-rose-200 font-medium">
                          Este menor ya realizó su fichaje para <span className="font-bold underline uppercase">{currentMode}</span> a las:
                        </p>
                        <p className="text-2xl font-black font-mono text-rose-300 mt-1">
                          ⏰ {feedback.previousTime}
                        </p>
                        <p className="text-[10px] text-rose-300/80 mt-1">
                          Intento duplicado bloqueado automáticamente a las {feedback.timestamp}
                        </p>
                      </div>
                    )}

                    {/* MINOR DETAILS CARD (FOR SUCCESS & DUPLICATE) */}
                    {feedback.minor && (
                      <div className="mt-3 bg-slate-950/70 rounded-xl p-3.5 border border-slate-800">
                        <div className="flex items-center space-x-3 mb-2.5">
                          <div className="text-3xl bg-slate-800 p-2 rounded-xl">
                            {feedback.minor.avatar}
                          </div>
                          <div>
                            <div className="flex items-center space-x-2">
                              <span className="font-mono text-xs font-bold text-brand-400 bg-brand-500/10 px-1.5 py-0.5 rounded border border-brand-500/20">
                                {feedback.minor.id}
                              </span>
                              <span className="text-[11px] font-mono text-slate-400">
                                {feedback.minor.wristband}
                              </span>
                            </div>
                            <h4 className="text-lg font-bold text-white leading-tight">
                              {feedback.minor.name}
                            </h4>
                            <p className="text-xs text-slate-400">
                              {feedback.minor.age} años · {feedback.minor.zone}
                            </p>
                          </div>
                        </div>

                        {/* HIGH CONTRAST MEDICAL / ALLERGY WARNING CARD */}
                        {feedback.minor.medical && (
                          <div className={`mt-2 p-3 rounded-xl border-2 flex items-start space-x-2.5 ${
                            feedback.minor.medical.severity === 'high'
                              ? 'bg-amber-500/25 border-amber-500 text-amber-200'
                              : 'bg-amber-500/15 border-amber-500/60 text-amber-200'
                          }`}>
                            <span className="text-2xl">⚠️</span>
                            <div>
                              <div className="flex items-center space-x-2">
                                <span className="text-[10px] font-black uppercase tracking-wider bg-amber-500 text-slate-950 px-1.5 py-0.2 rounded font-mono">
                                  {feedback.minor.medical.type}
                                </span>
                              </div>
                              <h5 className="font-black text-sm text-amber-300 mt-0.5 leading-snug">
                                {feedback.minor.medical.title}
                              </h5>
                              <p className="text-xs font-medium text-amber-100 mt-0.5">
                                {feedback.minor.medical.description}
                              </p>
                            </div>
                          </div>
                        )}

                        {/* INFO DETAILS ROW */}
                        <div className="mt-3 pt-2.5 border-t border-slate-800 grid grid-cols-2 gap-2 text-[11px]">
                          <div>
                            <span className="text-slate-400">Monitor Responsable:</span>
                            <p className="font-semibold text-slate-200">{feedback.minor.monitor}</p>
                          </div>
                          <div>
                            <span className="text-slate-400">Hora de Fichaje:</span>
                            <p className="font-mono font-bold text-emerald-400">{feedback.timestamp}</p>
                          </div>
                          {currentMode === 'moviles' && (
                            <div className="col-span-2 bg-indigo-950/40 p-2 rounded-lg border border-indigo-800/40">
                              <span className="text-indigo-300 font-semibold">Dispositivo Asignado:</span>
                              <p className="text-xs text-white font-mono">{feedback.minor.phoneModel}</p>
                            </div>
                          )}
                        </div>
                      </div>
                    )}

                    {/* NOT FOUND HELPER */}
                    {feedback.status === 'not_found' && (
                      <div className="mt-2 text-center p-3 bg-amber-950/30 border border-amber-500/30 rounded-xl">
                        <p className="text-xs text-amber-200">
                          Comprueba que el código de la pulsera esté dado de alta en la base de datos o prueba a buscarlo por nombre en el panel de resumen.
                        </p>
                      </div>
                    )}

                    {/* QUICK ACTION TO NEXT SCAN */}
                    <button
                      onClick={() => {
                        setFeedback(null);
                        if (inputRef.current) inputRef.current.focus();
                      }}
                      className="w-full mt-3 py-2.5 bg-slate-800 hover:bg-slate-700 active:scale-98 rounded-xl font-bold text-xs uppercase tracking-wider text-slate-200 border border-slate-700 transition-all flex items-center justify-center gap-1.5"
                    >
                      <span>Listo para siguiente escaneo</span>
                      <span>➔</span>
                    </button>
                  </div>
                ) : (
                  /* IDLE / WAITING STATE CARD */
                  <div className="flex-1 flex flex-col items-center justify-center p-6 text-center bg-slate-900/40 rounded-2xl border border-dashed border-slate-800">
                    <div className="w-16 h-16 rounded-2xl bg-slate-800/80 border border-slate-700/60 flex items-center justify-center text-3xl mb-3 shadow-inner">
                      {MODES.find(m => m.id === currentMode)?.icon || '📡'}
                    </div>
                    <h3 className="text-base font-bold text-slate-200">
                      Esperando Lectura de Pulsera
                    </h3>
                    <p className="text-xs text-slate-400 mt-1 max-w-xs">
                      Apunta la pistola lectora a la pulsera del menor o pulsa en uno de los menores de prueba de arriba.
                    </p>

                    <div className="mt-4 flex items-center gap-2 text-[11px] text-slate-400 bg-slate-950 px-3 py-1.5 rounded-full border border-slate-800">
                      <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                      <span>Modo activo: <strong className="text-white uppercase">{currentMode}</strong></span>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* VIEW: SUMMARY & ATTENDANCE DASHBOARD */}
            {currentView === 'summary' && (
              <div className="flex-1 flex flex-col space-y-3">
                
                {/* SEARCH AND FILTER BAR */}
                <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-3 shadow-lg">
                  <div className="relative">
                    <input
                      type="text"
                      value={searchTerm}
                      onChange={(e) => setSearchTerm(e.target.value)}
                      placeholder="Buscar por nombre, ID o habitación..."
                      className="w-full bg-slate-950 border border-slate-700 text-sm rounded-xl px-3.5 py-2.5 text-white placeholder:text-slate-500 focus:outline-none focus:border-brand-500"
                    />
                    {searchTerm && (
                      <button
                        onClick={() => setSearchTerm('')}
                        className="absolute right-3 top-2.5 text-slate-400 hover:text-white text-xs"
                      >
                        ✕
                      </button>
                    )}
                  </div>

                  {/* SUMMARY QUICK STATS PILLS */}
                  <div className="grid grid-cols-3 gap-2 mt-2.5">
                    <div className="bg-slate-950 p-2 rounded-xl border border-slate-800 text-center">
                      <span className="text-[10px] text-slate-400 uppercase font-semibold">Total</span>
                      <p className="text-base font-black text-white">{totalCount}</p>
                    </div>
                    <div className="bg-emerald-950/40 p-2 rounded-xl border border-emerald-500/30 text-center">
                      <span className="text-[10px] text-emerald-400 uppercase font-semibold">Pasados</span>
                      <p className="text-base font-black text-emerald-400">{registeredCount}</p>
                    </div>
                    <div className="bg-rose-950/30 p-2 rounded-xl border border-rose-500/30 text-center">
                      <span className="text-[10px] text-rose-300 uppercase font-semibold">Pendientes</span>
                      <p className="text-base font-black text-rose-300">{totalCount - registeredCount}</p>
                    </div>
                  </div>
                </div>

                {/* LIST OF MINORS */}
                <div className="flex-1 overflow-y-auto space-y-2 pr-0.5">
                  {minors
                    .filter(m => {
                      if (!searchTerm) return true;
                      const q = searchTerm.toLowerCase();
                      return (
                        m.name.toLowerCase().includes(q) ||
                        m.id.toLowerCase().includes(q) ||
                        m.zone.toLowerCase().includes(q) ||
                        (m.medical && m.medical.title.toLowerCase().includes(q))
                      );
                    })
                    .map(kid => {
                      const record = activeRecords[kid.id];
                      const isRegistered = !!record;

                      return (
                        <div
                          key={kid.id}
                          className={`p-3 rounded-xl border transition-all ${
                            isRegistered
                              ? 'bg-slate-900/60 border-emerald-500/40 shadow-sm'
                              : 'bg-slate-900/30 border-slate-800'
                          }`}
                        >
                          <div className="flex items-center justify-between">
                            <div className="flex items-center space-x-2.5">
                              <span className="text-2xl">{kid.avatar}</span>
                              <div>
                                <div className="flex items-center space-x-2">
                                  <span className="font-mono text-[10px] font-bold text-slate-400 bg-slate-800 px-1.5 py-0.2 rounded">
                                    {kid.id}
                                  </span>
                                  <h4 className="font-bold text-sm text-white">
                                    {kid.name}
                                  </h4>
                                </div>
                                <p className="text-[11px] text-slate-400">
                                  {kid.zone} · Mon: {kid.monitor}
                                </p>
                              </div>
                            </div>

                            {/* Status badge & toggle button */}
                            <button
                              onClick={() => toggleManualMinor(kid.id)}
                              className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all active:scale-95 flex items-center space-x-1.5 ${
                                isRegistered
                                  ? 'bg-emerald-500 text-slate-950 hover:bg-emerald-400'
                                  : 'bg-slate-800 text-slate-300 hover:bg-slate-700 border border-slate-700'
                              }`}
                            >
                              <span>{isRegistered ? '✓ Fichado' : '+ Fichar'}</span>
                            </button>
                          </div>

                          {/* Allergy badge if any */}
                          {kid.medical && (
                            <div className="mt-2 pt-1.5 border-t border-slate-800/80 flex items-center space-x-1.5">
                              <span className="text-xs">⚠️</span>
                              <span className="text-[10px] font-bold text-amber-300 bg-amber-500/20 px-2 py-0.5 rounded border border-amber-500/30">
                                {kid.medical.title}
                              </span>
                            </div>
                          )}

                          {isRegistered && record.timestamp && (
                            <div className="mt-1 text-[10px] font-mono text-emerald-400/90 text-right">
                              Registrado a las {record.timestamp}
                            </div>
                          )}
                        </div>
                      );
                    })}
                </div>

                {/* BOTTOM UTILITY ACTIONS */}
                <div className="pt-2 flex items-center gap-2">
                  <button
                    onClick={resetCurrentSession}
                    className="flex-1 py-2 px-3 rounded-xl bg-rose-950/40 hover:bg-rose-900/50 text-rose-300 text-xs font-semibold border border-rose-800/50 transition-colors"
                  >
                    🗑️ Reiniciar Sesión {MODES.find(m => m.id === currentMode)?.label}
                  </button>

                  <button
                    onClick={() => {
                      alert(`Exportado reporte de ${MODES.find(m => m.id === currentMode)?.label}: ${registeredCount} de ${totalCount} menores presentes.`);
                    }}
                    className="py-2 px-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold border border-slate-700"
                  >
                    📤 Exportar
                  </button>
                </div>
              </div>
            )}
          </main>

          {/* BOTTOM NAVIGATION BAR (FIXED FOR THUMB ERGONOMICS) */}
          <nav className="fixed bottom-0 left-0 right-0 bg-slate-950/95 backdrop-blur-lg border-t border-slate-800 px-6 py-2 z-50 max-w-md mx-auto">
            <div className="grid grid-cols-2 gap-3">
              <button
                onClick={() => setCurrentView('scan')}
                className={`flex flex-col items-center justify-center py-2 px-3 rounded-xl transition-all ${
                  currentView === 'scan'
                    ? 'bg-brand-600/20 text-brand-400 border border-brand-500/40 shadow-md font-bold'
                    : 'text-slate-400 hover:text-slate-200'
                }`}
              >
                <span className="text-xl">⚡</span>
                <span className="text-xs mt-0.5">Escáner / Entrada</span>
              </button>

              <button
                onClick={() => setCurrentView('summary')}
                className={`flex flex-col items-center justify-center py-2 px-3 rounded-xl transition-all relative ${
                  currentView === 'summary'
                    ? 'bg-brand-600/20 text-brand-400 border border-brand-500/40 shadow-md font-bold'
                    : 'text-slate-400 hover:text-slate-200'
                }`}
              >
                <span className="text-xl">📋</span>
                <span className="text-xs mt-0.5">Resumen ({registeredCount})</span>
                {registeredCount > 0 && (
                  <span className="absolute top-1.5 right-6 w-2 h-2 rounded-full bg-emerald-400"></span>
                )}
              </button>
            </div>
          </nav>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
