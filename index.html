    // Web Audio API Synthesizer (Zero-latency institutional beeps)
    const playAudioFeedback = (type) => {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();

        if (type === 'success') {
          const now = ctx.currentTime;
          const osc1 = ctx.createOscillator();
          const gain1 = ctx.createGain();
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(659.25, now);
          osc1.frequency.exponentialRampToValueAtTime(880, now + 0.1);
          gain1.gain.setValueAtTime(0.2, now);
          gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          osc1.connect(gain1);
          gain1.connect(ctx.destination);
          osc1.start(now);
          osc1.stop(now + 0.22);

          const osc2 = ctx.createOscillator();
          const gain2 = ctx.createGain();
          osc2.type = 'triangle';
          osc2.frequency.setValueAtTime(880, now + 0.1);
          osc2.frequency.exponentialRampToValueAtTime(1318.5, now + 0.3);
          gain2.gain.setValueAtTime(0.18, now + 0.1);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc2.connect(gain2);
          gain2.connect(ctx.destination);
          osc2.start(now + 0.1);
          osc2.stop(now + 0.35);
        } else if (type === 'duplicate' || type === 'error') {
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(240, now);
          osc.frequency.setValueAtTime(180, now + 0.12);
          gain.gain.setValueAtTime(0.28, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.38);
        } else if (type === 'beep') {
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1174.66, now);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.06);
        }
      } catch (e) {}
    };

      const [newMinorForm, setNewMinorForm] = useState({

      // Registros por turno
      const [records, setRecords] = useState({
        desayuno: { 'ID-001': { timestamp: '08:42:10', registeredBy: 'Carlos Ruiz (Educador)' } },
        mediodia: {},
        comida: {
          'ID-002': { timestamp: '13:45:10', registeredBy: 'Laura Sánchez (Educador)' },
          'ID-007': { timestamp: '13:51:24', registeredBy: 'Laura Sánchez (Educador)' }

        merienda: {},
        cena: {},
        moviles: { 'ID-005': { timestamp: '10:15:00', registeredBy: 'Ana Beltrán (ATE)' } }
      });

      const inputRef = useRef(null);

      useEffect(() => {
        const updateClock = () => {
          const now = new Date();
          setCurrentTimeStr(now.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
        };
        updateClock();
        const interval = setInterval(updateClock, 1000);
        return () => clearInterval(interval);
      }, []);

      const activeRecords = records[currentMode] || {};
      const registeredCount = Object.keys(activeRecords).length;
      const totalCount = minors.length;
      const pendingCount = totalCount - registeredCount;
      const percentage = Math.round((registeredCount / totalCount) * 100) || 0;

      const handleLoginSubmit = (e) => {
        e.preventDefault();
        if (!currentUser.name.trim()) return;
        setNavScreen('menu');
      };

      const processScan = (rawCode) => {
        const code = (rawCode || '').trim().toUpperCase();
        if (!code) return;

        playAudioFeedback('beep');

        const found = minors.find(m => 
          m.id.toUpperCase() === code ||
          m.wristband.toUpperCase() === code ||
          m.name.toUpperCase().includes(code)
        );

        const now = new Date();
        const timestampStr = now.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        const operatorInfo = `${currentUser.name} (${STAFF_ROLES.find(r => r.id === currentUser.role)?.label})`;

        if (!found) {
          playAudioFeedback('error');
          triggerHaptic([150, 80, 150]);
          setScreenFlash('red');
          setFeedback({
            status: 'not_found',
            code,
            timestamp: timestampStr,
            message: `Código no registrado: "${code}"`
          });
          setTimeout(() => setScreenFlash(null), 400);
          setInputCode('');
          return;
        }

        const previousRecord = activeRecords[found.id];

        if (previousRecord) {
          playAudioFeedback('duplicate');
          triggerHaptic([250, 100, 250]);
          setScreenFlash('red');
          setFeedback({
            status: 'duplicate',
            minor: found,
            timestamp: timestampStr,
            previousTime: previousRecord.timestamp,
            registeredBy: previousRecord.registeredBy,
            message: 'REGISTRO PREVIO EXISTENTE'
          });
          setTimeout(() => setScreenFlash(null), 500);
        } else {
          playAudioFeedback('success');
          triggerHaptic([90]);
          setScreenFlash('green');

          setRecords(prev => ({
            ...prev,
            [currentMode]: {
              ...prev[currentMode],
              [found.id]: { timestamp: timestampStr, registeredBy: operatorInfo }
            }
          }));

          setFeedback({
            status: 'success',
            minor: found,
            timestamp: timestampStr,
            registeredBy: operatorInfo,
            message: currentMode === 'moviles' ? 'Dispositivo verificado y registrado' : 'Acceso validado y registrado'
          });
          setTimeout(() => setScreenFlash(null), 500);
        }

        setInputCode('');
      };

      const handleToggleManual = (minorId) => {
        const isReg = !!activeRecords[minorId];
        const now = new Date();
        const timestampStr = now.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        const operatorInfo = `${currentUser.name} (${STAFF_ROLES.find(r => r.id === currentUser.role)?.label})`;

        if (isReg) {
          setRecords(prev => {
            const copy = { ...prev[currentMode] };
            delete copy[minorId];
            return { ...prev, [currentMode]: copy };
          });
        } else {
          setRecords(prev => ({
            ...prev,
            [currentMode]: {
              ...prev[currentMode],
              [minorId]: { timestamp: timestampStr, registeredBy: operatorInfo }
            }
          }));
          playAudioFeedback('success');
        }

                  newMinorForm.medicalAlert === 'halal' ? 'Dieta Cultural' : 'Condición Médica',

                  </div>

                  <div className="font-mono text-xs font-semibold text-slate-300 bg-samu-navy-950 px-2 py-0.5 rounded-lg border border-samu-navy-800">
                    {currentTimeStr || '12:00:00'}
                  </div>
                </div>

                {/* Fila 2: Selector de los 6 turnos requeridos */}
                <div className="flex items-center space-x-1 overflow-x-auto no-scrollbar py-1">
                  {MODES.map((m) => {
                    const isActive = currentMode === m.id;
                    return (
                      <button
                        key={m.id}
                        type="button"
                        onClick={() => {
                          setCurrentMode(m.id);
                          setFeedback(null);
                        }}
                        className={`flex-shrink-0 px-3 py-1.5 rounded-lg text-xs font-semibold transition-all ${
                          isActive
                            ? 'bg-samu-navy-700 text-white shadow-sm font-bold border border-samu-red-500'
                            : 'bg-samu-navy-950 text-slate-400 hover:text-slate-200 border border-samu-navy-800'
                        }`}
                      >
                        {m.label}
                      </button>
                    );
                  })}
                </div>

                {/* Fila 3: KPI Resumido superior */}
                <div className="mt-2 pt-2 border-t border-samu-navy-800 flex items-center justify-between text-xs">
                  <div className="flex items-center space-x-2">
                    <span className="text-slate-400 font-medium">Turno:</span>
                    <span className="font-bold text-white uppercase">{MODES.find(m => m.id === currentMode)?.label}</span>
                    <span className="text-[11px] text-slate-400 font-mono">({MODES.find(m => m.id === currentMode)?.schedule})</span>
                  </div>
                  <div className="flex items-center space-x-1.5 font-mono text-[11px]">
                    <span className="text-emerald-400 font-bold">{registeredCount}</span>
                    <span className="text-slate-500">/</span>
                    <span className="text-slate-300">{totalCount}</span>
                    <span className="text-slate-400">({percentage}%)</span>
                  </div>
                </div>
              </header>

              <main className="flex-1 px-3.5 py-3 flex flex-col space-y-3 pb-24">

                {/* SUBVISTA A: ESCÁNER / ENTRADA */}
                {recountView === 'scan' && (
                  <div className="flex-1 flex flex-col space-y-3">
                    
                    <div className="bg-samu-navy-900 border border-samu-navy-800 rounded-xl p-3 shadow-sm">
                      <div className="flex items-center justify-between mb-1.5">
                        <span className="text-[11px] font-bold uppercase tracking-wider text-slate-300">
                          Lector de Pulsera o Identificador
                        </span>
                        <span className="text-[10px] text-slate-400 font-mono">Pistola HID / Teclado</span>
                      </div>

                      <form onSubmit={(e) => { e.preventDefault(); processScan(inputCode); }} className="relative">
                        <input
                          ref={inputRef}
                          type="text"
                          value={inputCode}
                          onChange={(e) => setInputCode(e.target.value)}
                          placeholder="Pasa la pulsera o pulsa un menor abajo..."
                          className="w-full bg-samu-navy-950 border border-samu-navy-800 focus:border-samu-red-500 text-white font-mono text-sm px-3.5 py-3 rounded-lg outline-none placeholder:text-slate-500 transition-all pr-24"
                          autoComplete="off"
                          autoCapitalize="characters"
                          spellCheck="false"
                        />

                        {inputCode && (
                          <button
                            type="button"
                            onClick={() => setInputCode('')}
                            className="absolute right-20 top-2.5 text-slate-400 hover:text-white p-1 text-xs"
                          >
                            ✕
                          </button>
                        )}

                        <button
                          type="submit"
                          className="absolute right-1.5 top-1.5 bottom-1.5 bg-samu-red-600 hover:bg-samu-red-500 text-white font-bold text-xs uppercase px-3 rounded-md transition-colors shadow-sm"
                        >
                          Validar
                        </button>
                      </form>

                      {/* Botones de prueba táctil */}
                      <div className="mt-3 pt-2.5 border-t border-samu-navy-800">
                        <div className="flex items-center justify-between mb-2">
                          <span className="text-[11px] font-semibold text-slate-300">
                            Prueba rápida táctil:
                          </span>
                          <span className="text-[10px] text-slate-400">Toca para registrar</span>
                        </div>

                        <div className="grid grid-cols-3 gap-1.5">
                          <button
                            type="button"
                            onClick={() => processScan('ID-001')}
                            className="p-2 rounded-lg bg-samu-navy-950 border border-amber-500/40 hover:border-amber-400 text-left transition-all active:scale-95"
                          >
                            <div className="text-[10px] font-mono font-bold text-amber-400">ID-001 (Celíaco)</div>
                            <div className="text-xs font-semibold text-slate-200 truncate">Juan Pérez</div>
                            <div className="text-[9px] text-amber-300 font-mono mt-0.5">Sin gluten</div>
                          </button>

                          <button
                            type="button"
                            onClick={() => processScan('ID-002')}
                            className="p-2 rounded-lg bg-samu-navy-950 border border-samu-navy-800 hover:border-slate-500 text-left transition-all active:scale-95"
                          >
                            <div className="text-[10px] font-mono font-bold text-slate-400">ID-002 (Ordinario)</div>
                            <div className="text-xs font-semibold text-slate-200 truncate">Sofía Gómez</div>
                            <div className="text-[9px] text-slate-400 font-mono mt-0.5">Estándar</div>
                          </button>

                          <button
                            type="button"
                            onClick={() => processScan(minors[0]?.id || 'ID-004')}
                            className="p-2 rounded-lg bg-samu-navy-950 border border-samu-red-500/40 hover:border-samu-red-400 text-left transition-all active:scale-95"
                          >
                            <div className="text-[10px] font-mono font-bold text-samu-red-400">{minors[0]?.id} (Último)</div>
                            <div className="text-xs font-semibold text-slate-200 truncate">{minors[0]?.name}</div>
                            <div className="text-[9px] text-slate-400 font-mono mt-0.5">Reciente</div>
                          </button>
                        </div>
                      </div>
                    </div>

                    {/* Ficha dinámica de feedback */}
                    {feedback ? (
                      <div className={`rounded-xl border p-4 shadow-xl transition-all ${
                        feedback.status === 'success' 
                          ? 'bg-samu-navy-900 border-emerald-500/80 shadow-emerald-950/30' 
                          : feedback.status === 'duplicate'
                          ? 'bg-samu-navy-900 border-samu-red-500/90 ring-2 ring-samu-red-500/40 shadow-rose-950/40'
                          : 'bg-samu-navy-900 border-amber-500/80 shadow-amber-950/30'
                      }`}>
                        <div className="flex items-start justify-between">
                          <div className="flex items-center space-x-2.5">
                            <div className={`w-8 h-8 rounded-lg flex items-center justify-center font-bold text-sm ${
                              feedback.status === 'success' ? 'bg-emerald-500 text-slate-950' :
                              feedback.status === 'duplicate' ? 'bg-samu-red-600 text-white' : 'bg-amber-500 text-slate-950'
                            }`}>
                              {feedback.status === 'success' ? '✓' : '!'}
                            </div>
                            <div>
                              <span className={`text-[10px] font-bold uppercase tracking-wider ${
                                feedback.status === 'success' ? 'text-emerald-400' : 'text-samu-red-400'
                              }`}>
                                {feedback.status === 'success' ? 'Validación Correcta' : 'Aviso de Acceso'}
                              </span>
                              <h3 className="text-sm font-bold text-white leading-tight">
                                {feedback.message}
                              </h3>
                            </div>
                          </div>

                          <button
                            type="button"
                            onClick={() => setFeedback(null)}
                            className="text-slate-400 hover:text-white p-1 rounded bg-samu-navy-950 text-xs"
                          >
                            ✕
                          </button>
                        </div>

                        {feedback.status === 'duplicate' && feedback.previousTime && (
                          <div className="mt-3 p-3 bg-samu-red-600/15 border border-samu-red-500/50 rounded-lg text-center">
                            <p className="text-xs text-rose-200">
                              Este menor ya fue registrado en el turno de <strong className="uppercase">{currentMode}</strong>:
                            </p>
                            <p className="text-xl font-black font-mono text-samu-red-400 mt-0.5">
                              {feedback.previousTime}
                            </p>
                            <p className="text-[10px] text-rose-300/80 mt-0.5">
                              Fichado por: {feedback.registeredBy || 'Personal'}
                            </p>
                          </div>
                        )}

                        {feedback.minor && (
                          <div className="mt-3 bg-samu-navy-950 rounded-lg p-3 border border-samu-navy-800">
                            <div className="flex items-center space-x-2.5 mb-2">
                              <div className="w-10 h-10 rounded-lg bg-samu-navy-850 text-white flex items-center justify-center font-mono font-bold text-xs border border-samu-navy-700">
                                {feedback.minor.initials}
                              </div>
                              <div>
                                <div className="flex items-center space-x-1.5">
                                  <span className="font-mono text-[10px] font-bold text-white bg-samu-navy-800 px-1 py-0.2 rounded border border-samu-navy-700">
                                    {feedback.minor.id}
                                  </span>
                                  <span className="text-[10px] font-mono text-slate-400">
                                    {feedback.minor.wristband}
                                  </span>
                                </div>
                                <h4 className="text-sm font-bold text-white mt-0.5">
                                  {feedback.minor.name}
                                </h4>
                                <p className="text-[11px] text-slate-400">
                                  {feedback.minor.age} años · {feedback.minor.zone}
                                </p>
                              </div>
                            </div>

                            {feedback.minor.medical && (
                              <div className="mt-2 p-2.5 rounded-lg border border-amber-500/50 bg-amber-500/10 text-amber-200">
                                <span className="text-[9px] font-bold uppercase tracking-wider bg-amber-500 text-slate-950 px-1 py-0.2 rounded font-mono">
                                  {feedback.minor.medical.type}
                                </span>
                                <h5 className="font-bold text-xs text-amber-300 mt-1">
                                  {feedback.minor.medical.title}
                                </h5>
                                <p className="text-[11px] text-amber-200/90 mt-0.5">
                                  {feedback.minor.medical.description}
                                </p>
                              </div>
                            )}

                            <div className="mt-2.5 pt-2 border-t border-samu-navy-800 grid grid-cols-2 gap-2 text-[11px]">
                              <div>
                                <span className="text-slate-400 block">Registrado Por:</span>
                                <span className="font-medium text-slate-200">{feedback.registeredBy || currentUser.name}</span>
                              </div>
                              <div>
                                <span className="text-slate-400 block">Hora de Registro:</span>
                                <span className="font-mono font-bold text-emerald-400">{feedback.timestamp}</span>
                              </div>
                            </div>
                          </div>
                        )}

                        <button
                          type="button"
                          onClick={() => setFeedback(null)}
                          className="w-full mt-3 py-2 bg-samu-navy-800 hover:bg-samu-navy-700 rounded-lg text-xs font-semibold text-slate-200 border border-samu-navy-700 transition-colors"
                        >
                          Aceptar y continuar escaneo
                        </button>
                      </div>
                    ) : (
                      <div className="flex-1 flex flex-col items-center justify-center p-6 text-center bg-samu-navy-900/40 rounded-xl border border-dashed border-samu-navy-800">
                        <div className="w-10 h-10 rounded-lg bg-samu-navy-850 border border-samu-navy-700 flex items-center justify-center text-slate-300 font-mono text-sm mb-2.5">
                          RF
                        </div>
                        <h3 className="text-sm font-semibold text-slate-200">
                          Dispositivo listo para lectura
                        </h3>
                        <p className="text-xs text-slate-400 mt-1 max-w-xs">
                          Acerca el lector a la pulsera del residente o usa los accesos de prueba táctil.
                        </p>
                      </div>
                    )}
                  </div>
                )}

                {/* SUBVISTA B: RESUMEN Y ASISTENCIA CON KPIS FILTRABLES */}
                {recountView === 'summary' && (
                  <div className="flex-1 flex flex-col space-y-3">
                    
                    <div className="grid grid-cols-3 gap-2">
                      <button
                        type="button"
                        onClick={() => setSummaryFilter('all')}
                        className={`p-2.5 rounded-xl border text-center transition-all ${
                          summaryFilter === 'all'
                            ? 'bg-samu-navy-800 border-samu-red-500 ring-2 ring-samu-red-500/30'
                            : 'bg-samu-navy-900 border-samu-navy-800 hover:border-slate-600'
                        }`}
                      >
                        <span className="text-[10px] uppercase font-bold text-slate-400 block">Total</span>
                        <p className="text-lg font-black text-white font-mono mt-0.5">{totalCount}</p>
                        <span className="text-[9px] text-slate-400 block">Ver todos</span>
                      </button>

                      <button
                        type="button"
                        onClick={() => setSummaryFilter('passed')}
                        className={`p-2.5 rounded-xl border text-center transition-all ${
                          summaryFilter === 'passed'
                            ? 'bg-emerald-950/60 border-emerald-500 ring-2 ring-emerald-500/30'
                            : 'bg-samu-navy-900 border-samu-navy-800 hover:border-emerald-500/40'
                        }`}
                      >
                        <span className="text-[10px] uppercase font-bold text-emerald-400 block">Fichados</span>
                        <p className="text-lg font-black text-emerald-400 font-mono mt-0.5">{registeredCount}</p>
                        <span className="text-[9px] text-emerald-300/70 block">Solo pasados</span>
                      </button>

                      <button
                        type="button"
                        onClick={() => setSummaryFilter('pending')}
                        className={`p-2.5 rounded-xl border text-center transition-all ${
                          summaryFilter === 'pending'
                            ? 'bg-samu-red-700/40 border-samu-red-500 ring-2 ring-samu-red-500/30'
                            : 'bg-samu-navy-900 border-samu-navy-800 hover:border-samu-red-500/40'
                        }`}
                      >
                        <span className="text-[10px] uppercase font-bold text-samu-red-400 block">Pendientes</span>
                        <p className="text-lg font-black text-samu-red-400 font-mono mt-0.5">{pendingCount}</p>
                        <span className="text-[9px] text-rose-300/70 block">Faltan</span>
                      </button>
                    </div>

                    <div className="bg-samu-navy-900 border border-samu-navy-800 rounded-xl p-2.5 space-y-2">
                      <div className="relative">
                        <input
                          type="text"
                          value={searchQuery}
                          onChange={(e) => setSearchQuery(e.target.value)}
                          placeholder="Buscar por nombre, habitación o alergia..."
                          className="w-full bg-samu-navy-950 border border-samu-navy-800 text-xs rounded-lg px-3 py-2 text-white placeholder:text-slate-500 focus:outline-none focus:border-samu-red-500"
                        />
                        {searchQuery && (
                          <button
                            type="button"
                            onClick={() => setSearchQuery('')}
                            className="absolute right-2.5 top-2 text-slate-400 hover:text-white text-xs"
                          >
                            ✕
                          </button>
                        )}
                      </div>

                      <div className="flex items-center justify-between text-xs pt-1">
                        <span className="text-[11px] text-slate-400 font-medium">Filtro:</span>
                        <button
                          type="button"
                          onClick={() => setSummaryFilter('allergies')}
                          className={`text-[10px] font-bold px-2 py-0.5 rounded border transition-colors ${
                            summaryFilter === 'allergies'
                              ? 'bg-amber-500 text-slate-950 border-amber-400'
                              : 'bg-samu-navy-950 text-amber-300 border-amber-500/30'
                          }`}
                        >
                          Dietas / Alergias
                        </button>
                      </div>
                    </div>

                    <div className="flex-1 overflow-y-auto space-y-1.5 pr-0.5 max-h-[50vh]">
                      {minors
                        .filter((m) => {
                          const isReg = !!activeRecords[m.id];
                          if (summaryFilter === 'passed' && !isReg) return false;
                          if (summaryFilter === 'pending' && isReg) return false;
                          if (summaryFilter === 'allergies' && !m.medical) return false;

                          if (!searchQuery) return true;
                          const q = searchQuery.toLowerCase();
                          return (
                            m.name.toLowerCase().includes(q) ||
                            m.id.toLowerCase().includes(q) ||
                            m.zone.toLowerCase().includes(q) ||
                            (m.medical && m.medical.title.toLowerCase().includes(q))
                          );
                        })
                        .map((kid) => {
                          const record = activeRecords[kid.id];
                          const isReg = !!record;

                          return (
                            <div
                              key={kid.id}
                              className={`p-2.5 rounded-lg border transition-all ${
                                isReg
                                  ? 'bg-samu-navy-900/90 border-emerald-500/40'
                                  : 'bg-samu-navy-900/40 border-samu-navy-800'
                              }`}
                            >
                              <div className="flex items-center justify-between">
                                <div className="flex items-center space-x-2.5 truncate mr-2">
                                  <div className="w-8 h-8 rounded bg-samu-navy-850 text-white flex-shrink-0 flex items-center justify-center font-mono font-bold text-[11px] border border-samu-navy-700">
                                    {kid.initials}
                                  </div>
                                  <div className="truncate">
                                    <div className="flex items-center space-x-1.5">
                                      <span className="font-mono text-[9px] font-bold text-slate-300 bg-samu-navy-950 px-1 py-0.2 rounded border border-samu-navy-800">
                                        {kid.id}
                                      </span>
                                      <h4 className="font-bold text-xs text-white truncate">
                                        {kid.name}
                                      </h4>
                                    </div>
                                    <p className="text-[10px] text-slate-400 truncate mt-0.5">
                                      {kid.zone} · {kid.originCountry || 'España'}
                                    </p>
                                  </div>
                                </div>

                                <button
                                  type="button"
                                  onClick={() => handleToggleManual(kid.id)}
                                  className={`px-2.5 py-1 rounded text-xs font-bold transition-all flex-shrink-0 ${
                                    isReg
                                      ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 hover:bg-emerald-500/30'
                                      : 'bg-samu-navy-800 text-slate-200 hover:bg-samu-navy-700 border border-samu-navy-700'
                                  }`}
                                >
                                  {isReg ? '✓ Fichado' : '+ Fichar'}
                                </button>
                              </div>

                              {kid.medical && (
                                <div className="mt-1.5 pt-1 border-t border-samu-navy-800 flex items-center space-x-1 text-[10px] font-semibold text-amber-300">
                                  <span className="w-1.5 h-1.5 rounded-full bg-amber-400 flex-shrink-0"></span>
                                  <span className="truncate">{kid.medical.title}</span>
                                </div>
                              )}

                              {isReg && record.timestamp && (
                                <div className="mt-1 text-[9px] font-mono text-emerald-400/90 text-right">
                                  Fichado a las {record.timestamp} por {record.registeredBy || currentUser.name}
                                </div>
                              )}
                            </div>
                          );
                        })}
                    </div>

                    <div className="pt-2 flex items-center gap-2">
                      <button
                        type="button"
                        onClick={handleResetSession}
                        className="flex-1 py-2 px-3 rounded-lg bg-samu-red-600/20 hover:bg-samu-red-600/30 text-rose-300 text-xs font-semibold border border-samu-red-500/40 transition-colors"
                      >
                        Reiniciar {MODES.find(m => m.id === currentMode)?.label}
                      </button>

                      <button
                        type="button"
                        onClick={() => {
                          alert(`Informe del turno ${MODES.find(m => m.id === currentMode)?.label} (${currentUser.name} - SAMU):\nRegistrados: ${registeredCount}\nPendientes: ${pendingCount}\nTotal: ${totalCount}`);
                        }}
                        className="py-2 px-3 rounded-lg bg-samu-navy-800 hover:bg-samu-navy-700 text-slate-200 text-xs font-semibold border border-samu-navy-700"
                      >
                        Exportar
                      </button>
                    </div>
                  </div>
                )}
              </main>

              <nav className="fixed bottom-0 left-0 right-0 bg-samu-navy-950/95 backdrop-blur-lg border-t border-samu-navy-800 px-6 py-2 z-50 max-w-md mx-auto">
                <div className="grid grid-cols-2 gap-3">
                  <button
                    type="button"
                    onClick={() => setRecountView('scan')}
                    className={`py-2 px-3 rounded-lg text-xs font-bold transition-all text-center ${
                      recountView === 'scan'
                        ? 'bg-samu-navy-700 text-white shadow-sm border border-samu-red-500'
                        : 'text-slate-400 hover:text-slate-200 bg-samu-navy-900/60 border border-samu-navy-800'
                    }`}
                  >
                    Lector / Entrada
                  </button>

                  <button
                    type="button"
                    onClick={() => setRecountView('summary')}
                    className={`py-2 px-3 rounded-lg text-xs font-bold transition-all text-center relative ${
                      recountView === 'summary'
                        ? 'bg-samu-navy-700 text-white shadow-sm border border-samu-red-500'
                        : 'text-slate-400 hover:text-slate-200 bg-samu-navy-900/60 border border-samu-navy-800'
                    }`}
                  >
                    <span>Resumen ({registeredCount})</span>
                    {registeredCount > 0 && (
                      <span className="absolute top-1.5 right-3 w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                    )}
                  </button>
                </div>
              </nav>

            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
