    // Web Audio API Synthesizer (Zero-latency institutional beeps)
    const playAudioFeedback = (type) => {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();

        if (type === 'success') {
          // Double harmonic chime (High confidence)
          const now = ctx.currentTime;
          const osc1 = ctx.createOscillator();
          const gain1 = ctx.createGain();
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(659.25, now); // E5
          osc1.frequency.exponentialRampToValueAtTime(880, now + 0.1); // A5
          gain1.gain.setValueAtTime(0.2, now);
          gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          osc1.connect(gain1);
          gain1.connect(ctx.destination);
          osc1.start(now);
          osc1.stop(now + 0.22);

          const osc2 = ctx.createOscillator();
          const gain2 = ctx.createGain();
          osc2.type = 'triangle';
          osc2.frequency.setValueAtTime(880, now + 0.1);
          osc2.frequency.exponentialRampToValueAtTime(1318.5, now + 0.3); // E6
          gain2.gain.setValueAtTime(0.18, now + 0.1);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc2.connect(gain2);
          gain2.connect(ctx.destination);
          osc2.start(now + 0.1);
          osc2.stop(now + 0.35);
        } else if (type === 'duplicate' || type === 'error') {
          // Low reject pulse
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(240, now);
          osc.frequency.setValueAtTime(180, now + 0.12);
          gain.gain.setValueAtTime(0.28, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.38);
        } else if (type === 'beep') {
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1174.66, now);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.06);
        }
      } catch (e) {}
    };

    function App() {

      // Control de registros por turno
      const [records, setRecords] = useState({
        desayuno: { 'ID-001': { timestamp: '08:42:10' } },
        mediodia: {},
        comida: {
          'ID-002': { timestamp: '13:45:10' },
          'ID-007': { timestamp: '13:51:24' }
        },
        merienda: {},
        cena: {},
        moviles: { 'ID-005': { timestamp: '10:15:00' } }
      });

      const [feedback, setFeedback] = useState(null);
      const [screenFlash, setScreenFlash] = useState(null); // 'green' | 'red'
      const [currentTimeStr, setCurrentTimeStr] = useState('');

      const inputRef = useRef(null);

      // Reloj institucional en vivo
      useEffect(() => {
        const updateClock = () => {
          const now = new Date();
          setCurrentTimeStr(now.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
        };
        updateClock();
        const interval = setInterval(updateClock, 1000);
        return () => clearInterval(interval);
      }, []);

      const activeRecords = records[currentMode] || {};
      const registeredCount = Object.keys(activeRecords).length;
      const totalCount = MINORS_DATA.length;
      const pendingCount = totalCount - registeredCount;
      const percentage = Math.round((registeredCount / totalCount) * 100) || 0;

      // Proceso de escaneo o pulsación de prueba
      const processScan = (rawCode) => {
        const code = (rawCode || '').trim().toUpperCase();
        if (!code) return;

        playAudioFeedback('beep');

        const found = MINORS_DATA.find(m => 
          m.id.toUpperCase() === code ||
          m.wristband.toUpperCase() === code ||
          m.name.toUpperCase().includes(code)
        );

        const now = new Date();
        const timestampStr = now.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

        if (!found) {
          playAudioFeedback('error');
          triggerHaptic([150, 80, 150]);
          setScreenFlash('red');
          setFeedback({
            status: 'not_found',
            code,
            timestamp: timestampStr,
            message: `Código no registrado: "${code}"`
          });
          setTimeout(() => setScreenFlash(null), 400);
          setInputCode('');
          return;
        }

        const previousRecord = activeRecords[found.id];

        if (previousRecord) {
          // DUPLICADO DETECTADO
          playAudioFeedback('duplicate');
          triggerHaptic([250, 100, 250]);
          setScreenFlash('red');
          setFeedback({
            status: 'duplicate',
            minor: found,
            timestamp: timestampStr,
            previousTime: previousRecord.timestamp,
            message: 'REGISTRO PREVIO EXISTENTE'
          });
          setTimeout(() => setScreenFlash(null), 500);
        } else {
          // REGISTRO EXITOSO
          playAudioFeedback('success');
          triggerHaptic([90]);
          setScreenFlash('green');

          setRecords(prev => ({
            ...prev,
            [currentMode]: {
              ...prev[currentMode],
              [found.id]: { timestamp: timestampStr }
            }
          }));

          setFeedback({
            status: 'success',
            minor: found,
            timestamp: timestampStr,
            message: currentMode === 'moviles' ? 'Dispositivo verificado y registrado' : 'Acceso validado y registrado'
          });
          setTimeout(() => setScreenFlash(null), 500);
        }

        setInputCode('');
        // IMPORTANTE: NO llamamos a inputRef.current.focus() aquí para NO levantar el teclado en móviles
      };

      const handleFormSubmit = (e) => {

        processScan(inputCode);

        const now = new Date();

          setRecords(prev => {
            const copy = { ...prev[currentMode] };
            delete copy[minorId];
            return { ...prev, [currentMode]: copy };
          });
        } else {

            ...prev,

              [minorId]: { timestamp: timestampStr }
            }
          }));
          playAudioFeedback('success');
        }
        // NO enfocar input aquí para que no salte teclado móvil

                </div>

                        ? 'bg-blue-600 text-white shadow-sm font-bold'

                    }`}

                        className="p-2 rounded-lg bg-slate-950 border border-amber-500/40 hover:border-amber-400 text-left transition-all active:scale-95"
                      >
                        <div className="text-[10px] font-mono font-bold text-amber-400">ID-001 (Celíaco)</div>
                        <div className="text-xs font-semibold text-slate-200 truncate">Juan Pérez</div>
                        <div className="text-[9px] text-amber-300 font-mono mt-0.5">Sin gluten</div>
                      </button>

                      <button
                        type="button"
                        onClick={() => processScan('ID-002')}
                        className="p-2 rounded-lg bg-slate-950 border border-slate-700/80 hover:border-slate-500 text-left transition-all active:scale-95"
                      >
                        <div className="text-[10px] font-mono font-bold text-slate-400">ID-002 (Ordinario)</div>
                        <div className="text-xs font-semibold text-slate-200 truncate">Sofía Gómez</div>
                        <div className="text-[9px] text-slate-400 font-mono mt-0.5">Estándar</div>
                      </button>

                      <button
                        type="button"
                        onClick={() => processScan('ID-004')}
                        className="p-2 rounded-lg bg-slate-950 border border-rose-500/40 hover:border-rose-400 text-left transition-all active:scale-95"
                      >
                        <div className="text-[10px] font-mono font-bold text-rose-400">ID-004 (Crítico)</div>
                        <div className="text-xs font-semibold text-slate-200 truncate">Lucas Silva</div>
                        <div className="text-[9px] text-rose-300 font-mono mt-0.5">Frutos secos</div>
                      </button>
                    </div>
                  </div>
                </div>

                {/* TARJETA DINÁMICA DE FEEDBACK (ÉXITO / DUPLICADO / ALERTA) */}
                {feedback ? (
                  <div className={`rounded-xl border p-4 shadow-lg transition-all ${
                    feedback.status === 'success' 
                      ? 'bg-slate-900 border-emerald-500/80' 
                      : feedback.status === 'duplicate'
                      ? 'bg-slate-900 border-rose-500/80 ring-1 ring-rose-500/40'
                      : 'bg-slate-900 border-amber-500/80'
                  }`}>
                    
                    {/* Encabezado del feedback */}
                    <div className="flex items-start justify-between">
                      <div className="flex items-center space-x-2.5">
                        <div className={`w-8 h-8 rounded-lg flex items-center justify-center font-bold text-sm ${
                          feedback.status === 'success'
                            ? 'bg-emerald-500 text-slate-950'
                            : feedback.status === 'duplicate'
                            ? 'bg-rose-500 text-white'
                            : 'bg-amber-500 text-slate-950'
                        }`}>
                          {feedback.status === 'success' ? '✓' : '!'}
                        </div>
                        <div>
                          <span className={`text-[10px] font-bold uppercase tracking-wider ${
                            feedback.status === 'success' ? 'text-emerald-400' : 'text-rose-400'
                          }`}>
                            {feedback.status === 'success' ? 'Validación Correcta' : 'Aviso de Acceso'}
                          </span>
                          <h3 className="text-sm font-bold text-white leading-tight">
                            {feedback.message}
                          </h3>
                        </div>
                      </div>

                      <button
                        type="button"
                        onClick={() => setFeedback(null)}
                        className="text-slate-400 hover:text-white p-1 rounded bg-slate-800 text-xs"
                      >
                        ✕
                      </button>
                    </div>

                    {/* ALERTA DE DUPLICADO */}
                    {feedback.status === 'duplicate' && feedback.previousTime && (
                      <div className="mt-3 p-3 bg-rose-500/10 border border-rose-500/40 rounded-lg text-center">
                        <p className="text-xs text-rose-200">
                          Este menor ya fue registrado en el turno de <strong className="uppercase">{currentMode}</strong>:
                        </p>
                        <p className="text-xl font-black font-mono text-rose-400 mt-0.5">
                          {feedback.previousTime}
                        </p>
                        <p className="text-[10px] text-rose-300/70 mt-0.5">
                          Nuevo intento bloqueado a las {feedback.timestamp}
                        </p>
                      </div>
                    )}

                    {/* FICHA TÉCNICA DEL MENOR */}
                    {feedback.minor && (
                      <div className="mt-3 bg-slate-950 rounded-lg p-3 border border-slate-800">
                        <div className="flex items-center space-x-2.5 mb-2">
                          <div className="w-10 h-10 rounded-lg bg-slate-800 text-slate-200 flex items-center justify-center font-mono font-bold text-xs border border-slate-700">
                            {feedback.minor.initials}
                          </div>
                          <div>
                            <div className="flex items-center space-x-1.5">
                              <span className="font-mono text-[10px] font-bold text-blue-400 bg-blue-500/10 px-1 py-0.2 rounded border border-blue-500/20">
                                {feedback.minor.id}
                              </span>
                              <span className="text-[10px] font-mono text-slate-400">
                                {feedback.minor.wristband}
                              </span>
                            </div>
                            <h4 className="text-sm font-bold text-white mt-0.5">
                              {feedback.minor.name}
                            </h4>
                            <p className="text-[11px] text-slate-400">
                              {feedback.minor.age} años · {feedback.minor.zone}
                            </p>
                          </div>
                        </div>

                        {/* TARJETA DE ALERTA MÉDICA / DIETA (ALTO CONTRASTE) */}
                        {feedback.minor.medical && (
                          <div className="mt-2 p-2.5 rounded-lg border border-amber-500/50 bg-amber-500/10 text-amber-200">
                            <div className="flex items-center space-x-1.5 mb-0.5">
                              <span className="text-[9px] font-bold uppercase tracking-wider bg-amber-500 text-slate-950 px-1 py-0.2 rounded font-mono">
                                {feedback.minor.medical.type}
                              </span>
                            </div>
                            <h5 className="font-bold text-xs text-amber-300">
                              {feedback.minor.medical.title}
                            </h5>
                            <p className="text-[11px] text-amber-200/90 mt-0.5">
                              {feedback.minor.medical.description}
                            </p>
                          </div>
                        )}

                        {/* DATOS ADICIONALES */}
                        <div className="mt-2.5 pt-2 border-t border-slate-800/80 grid grid-cols-2 gap-2 text-[11px]">
                          <div>
                            <span className="text-slate-500 block">Monitor Asignado:</span>
                            <span className="font-medium text-slate-300">{feedback.minor.monitor}</span>
                          </div>
                          <div>
                            <span className="text-slate-500 block">Hora de Registro:</span>
                            <span className="font-mono font-bold text-emerald-400">{feedback.timestamp}</span>
                          </div>
                          {currentMode === 'moviles' && (
                            <div className="col-span-2 bg-slate-900 p-2 rounded border border-slate-800 mt-1">
                              <span className="text-[10px] text-slate-400 block font-semibold">Dispositivo Vinculado:</span>
                              <span className="text-xs text-white font-mono">{feedback.minor.phoneModel}</span>
                            </div>
                          )}
                        </div>
                      </div>
                    )}

                    <button
                      type="button"
                      onClick={() => setFeedback(null)}
                      className="w-full mt-3 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs font-semibold text-slate-200 border border-slate-700 transition-colors"
                    >
                      Aceptar y continuar escaneo
                    </button>
                  </div>
                ) : (
                  /* ESTADO DE ESPERA LIMPIO */
                  <div className="flex-1 flex flex-col items-center justify-center p-6 text-center bg-slate-900/40 rounded-xl border border-dashed border-slate-800">
                    <div className="w-10 h-10 rounded-lg bg-slate-800/60 border border-slate-700 flex items-center justify-center text-slate-300 font-mono text-sm mb-2.5">
                      RF
                    </div>
                    <h3 className="text-sm font-semibold text-slate-200">
                      Dispositivo listo para lectura
                    </h3>
                    <p className="text-xs text-slate-400 mt-1 max-w-xs">
                      Acerca el lector a la pulsera del residente o usa los accesos de prueba táctil de arriba.
                    </p>
                  </div>
                )}
              </div>
            )}

            {/* VISTA 2: PANEL DE RESUMEN CON FILTRADO EN LOS KPIS */}
            {currentView === 'summary' && (
              <div className="flex-1 flex flex-col space-y-3">
                
                {/* 3 KPIS INTERACTIVOS: AL CLICAR FILTRAN DIRECTAMENTE */}
                <div className="grid grid-cols-3 gap-2">
                  {/* KPI: TOTAL */}
                  <button
                    type="button"
                    onClick={() => setSummaryFilter('all')}
                    className={`p-2.5 rounded-xl border text-center transition-all ${
                      summaryFilter === 'all'
                        ? 'bg-slate-800 border-blue-500 ring-2 ring-blue-500/30'
                        : 'bg-slate-900 border-slate-800 hover:border-slate-700'
                    }`}
                  >
                    <span className="text-[10px] uppercase font-bold text-slate-400 block">Total</span>
                    <p className="text-lg font-black text-white font-mono mt-0.5">{totalCount}</p>
                    <span className="text-[9px] text-slate-500 block">Ver todos</span>
                  </button>

                  {/* KPI: PASADOS / FICHADOS */}
                  <button
                    type="button"
                    onClick={() => setSummaryFilter('passed')}
                    className={`p-2.5 rounded-xl border text-center transition-all ${
                      summaryFilter === 'passed'
                        ? 'bg-emerald-950/60 border-emerald-500 ring-2 ring-emerald-500/30'
                        : 'bg-slate-900 border-slate-800 hover:border-emerald-500/40'
                    }`}
                  >
                    <span className="text-[10px] uppercase font-bold text-emerald-400 block">Fichados</span>
                    <p className="text-lg font-black text-emerald-400 font-mono mt-0.5">{registeredCount}</p>
                    <span className="text-[9px] text-emerald-300/70 block">Solo pasados</span>
                  </button>

                  {/* KPI: PENDIENTES */}
                  <button
                    type="button"
                    onClick={() => setSummaryFilter('pending')}
                    className={`p-2.5 rounded-xl border text-center transition-all ${
                      summaryFilter === 'pending'
                        ? 'bg-rose-950/60 border-rose-500 ring-2 ring-rose-500/30'
                        : 'bg-slate-900 border-slate-800 hover:border-rose-500/40'
                    }`}
                  >
                    <span className="text-[10px] uppercase font-bold text-rose-400 block">Pendientes</span>
                    <p className="text-lg font-black text-rose-400 font-mono mt-0.5">{pendingCount}</p>
                    <span className="text-[9px] text-rose-300/70 block">Faltan</span>
                  </button>
                </div>

                {/* FILTROS ADICIONALES Y BUSCADOR */}
                <div className="bg-slate-900 border border-slate-800 rounded-xl p-2.5 space-y-2">
                  <div className="relative">
                    <input
                      type="text"
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      placeholder="Buscar por nombre, habitación o alergia..."
                      className="w-full bg-slate-950 border border-slate-700 text-xs rounded-lg px-3 py-2 text-white placeholder:text-slate-500 focus:outline-none focus:border-blue-500"
                    />
                    {searchQuery && (
                      <button
                        type="button"
                        onClick={() => setSearchQuery('')}
                        className="absolute right-2.5 top-2 text-slate-400 hover:text-white text-xs"
                      >
                        ✕
                      </button>
                    )}
                  </div>

                  <div className="flex items-center justify-between text-xs pt-1">
                    <span className="text-[11px] text-slate-400 font-medium">Filtro activo:</span>
                    <div className="flex gap-1">
                      <button
                        type="button"
                        onClick={() => setSummaryFilter('allergies')}
                        className={`text-[10px] font-bold px-2 py-0.5 rounded border transition-colors ${
                          summaryFilter === 'allergies'
                            ? 'bg-amber-500 text-slate-950 border-amber-400'
                            : 'bg-slate-800 text-amber-300 border-amber-500/30'
                        }`}
                      >
                        Dietas / Alergias
                      </button>
                    </div>
                  </div>
                </div>

                {/* LISTADO DE RESIDENTES FILTRADO */}
                <div className="flex-1 overflow-y-auto space-y-1.5 pr-0.5 max-h-[50vh]">
                  {MINORS_DATA
                    .filter((m) => {
                      const isReg = !!activeRecords[m.id];
                      if (summaryFilter === 'passed' && !isReg) return false;
                      if (summaryFilter === 'pending' && isReg) return false;
                      if (summaryFilter === 'allergies' && !m.medical) return false;

                      if (!searchQuery) return true;
                      const q = searchQuery.toLowerCase();
                      return (
                        m.name.toLowerCase().includes(q) ||
                        m.id.toLowerCase().includes(q) ||
                        m.zone.toLowerCase().includes(q) ||
                        (m.medical && m.medical.title.toLowerCase().includes(q))
                      );
                    })
                    .map((kid) => {
                      const record = activeRecords[kid.id];
                      const isReg = !!record;

                      return (
                        <div
                          key={kid.id}
                          className={`p-2.5 rounded-lg border transition-all ${
                            isReg
                              ? 'bg-slate-900/80 border-emerald-500/40'
                              : 'bg-slate-900/40 border-slate-800'
                          }`}
                        >
                          <div className="flex items-center justify-between">
                            <div className="flex items-center space-x-2.5 truncate mr-2">
                              <div className="w-8 h-8 rounded bg-slate-800 text-slate-200 flex-shrink-0 flex items-center justify-center font-mono font-bold text-[11px] border border-slate-700">
                                {kid.initials}
                              </div>
                              <div className="truncate">
                                <div className="flex items-center space-x-1.5">
                                  <span className="font-mono text-[9px] font-bold text-slate-400 bg-slate-800 px-1 py-0.2 rounded">
                                    {kid.id}
                                  </span>
                                  <h4 className="font-bold text-xs text-white truncate">
                                    {kid.name}
                                  </h4>
                                </div>
                                <p className="text-[10px] text-slate-400 truncate mt-0.5">
                                  {kid.zone} · Mon: {kid.monitor}
                                </p>
                              </div>
                            </div>

                            <button
                              type="button"
                              onClick={() => handleToggleManual(kid.id)}
                              className={`px-2.5 py-1 rounded text-xs font-bold transition-all flex-shrink-0 ${
                                isReg
                                  ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 hover:bg-emerald-500/30'
                                  : 'bg-slate-800 text-slate-300 hover:bg-slate-700 border border-slate-700'
                              }`}
                            >
                              {isReg ? '✓ Fichado' : '+ Fichar'}
                            </button>
                          </div>

                          {kid.medical && (
                            <div className="mt-1.5 pt-1 border-t border-slate-800/80 flex items-center space-x-1 text-[10px] font-semibold text-amber-300">
                              <span className="w-1.5 h-1.5 rounded-full bg-amber-400 flex-shrink-0"></span>
                              <span className="truncate">{kid.medical.title}</span>
                            </div>
                          )}

                          {isReg && record.timestamp && (
                            <div className="mt-1 text-[9px] font-mono text-emerald-400/80 text-right">
                              Registrado a las {record.timestamp}
                            </div>
                          )}
                        </div>
                      );
                    })}
                </div>

                {/* ACCIONES DE CIERRE Y REINICIO */}
                <div className="pt-2 flex items-center gap-2">
                  <button
                    type="button"
                    onClick={handleResetSession}
                    className="flex-1 py-2 px-3 rounded-lg bg-rose-950/30 hover:bg-rose-900/40 text-rose-300 text-xs font-semibold border border-rose-800/40 transition-colors"
                  >
                    Reiniciar {MODES.find(m => m.id === currentMode)?.label}
                  </button>

                  <button
                    type="button"
                    onClick={() => {
                      alert(`Informe del turno ${MODES.find(m => m.id === currentMode)?.label}:\nRegistrados: ${registeredCount}\nPendientes: ${pendingCount}\nTotal: ${totalCount}`);
                    }}
                    className="py-2 px-3 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold border border-slate-700"
                  >
                    Exportar
                  </button>
                </div>
              </div>
            )}
          </main>

          {/* BARRA INFERIOR DE NAVEGACIÓN */}
          <nav className="fixed bottom-0 left-0 right-0 bg-slate-950/95 backdrop-blur-lg border-t border-slate-800 px-6 py-2 z-50 max-w-md mx-auto">
            <div className="grid grid-cols-2 gap-3">
              <button
                type="button"
                onClick={() => setCurrentView('scan')}
                className={`py-2 px-3 rounded-lg text-xs font-bold transition-all text-center ${
                  currentView === 'scan'
                    ? 'bg-blue-600 text-white shadow-sm'
                    : 'text-slate-400 hover:text-slate-200 bg-slate-900/60 border border-slate-800'
                }`}
              >
                Lector / Entrada
              </button>

              <button
                type="button"
                onClick={() => setCurrentView('summary')}
                className={`py-2 px-3 rounded-lg text-xs font-bold transition-all text-center relative ${
                  currentView === 'summary'
                    ? 'bg-blue-600 text-white shadow-sm'
                    : 'text-slate-400 hover:text-slate-200 bg-slate-900/60 border border-slate-800'
                }`}
              >
                <span>Resumen ({registeredCount})</span>
                {registeredCount > 0 && (
                  <span className="absolute top-1.5 right-3 w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                )}
              </button>
            </div>
          </nav>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
