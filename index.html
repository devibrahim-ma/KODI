    // Web Audio API Synthesizer (Zero-latency institutional beeps)
    const playAudioFeedback = (type) => {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();

        if (type === 'success') {
          // Double harmonic chime (High confidence)
          const now = ctx.currentTime;
          const osc1 = ctx.createOscillator();
          const gain1 = ctx.createGain();
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(659.25, now); // E5
          osc1.frequency.exponentialRampToValueAtTime(880, now + 0.1); // A5
          gain1.gain.setValueAtTime(0.2, now);
          gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          osc1.connect(gain1);
          gain1.connect(ctx.destination);
          osc1.start(now);
          osc1.stop(now + 0.22);

          const osc2 = ctx.createOscillator();
          const gain2 = ctx.createGain();
          osc2.type = 'triangle';
          osc2.frequency.setValueAtTime(880, now + 0.1);
          osc2.frequency.exponentialRampToValueAtTime(1318.5, now + 0.3); // E6
          gain2.gain.setValueAtTime(0.18, now + 0.1);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc2.connect(gain2);
          gain2.connect(ctx.destination);
          osc2.start(now + 0.1);
          osc2.stop(now + 0.35);
        } else if (type === 'duplicate' || type === 'error') {
          // Low reject pulse
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(240, now);
          osc.frequency.setValueAtTime(180, now + 0.12);
          gain.gain.setValueAtTime(0.28, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.38);
        } else if (type === 'beep') {
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1174.66, now);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.06);
        }
      } catch (e) {}
    };

    const STORAGE_KEYS = {

    function App() {

        return MINORS_DATA;

      // Estado de conexión y cola de sincronización
      const [isOnline, setIsOnline] = useState(typeof navigator !== 'undefined' ? navigator.onLine : true);
      const [syncQueue, setSyncQueue] = useState(() => {
        try {
          const stored = localStorage.getItem(STORAGE_KEYS.SYNC_QUEUE);
          return stored ? JSON.parse(stored) : [];
        } catch (e) { return []; }
      });

      const [inputCode, setInputCode] = useState('');

      const [searchTermMinors, setSearchTermMinors] = useState('');
      const [currentTimeStr, setCurrentTimeStr] = useState('');
      const [feedback, setFeedback] = useState(null);
      const [screenFlash, setScreenFlash] = useState(null);
      const [showAdvancedFiliation, setShowAdvancedFiliation] = useState(false);
      const [isProcessingPhoto, setIsProcessingPhoto] = useState(false);
      const [newMinorForm, setNewMinorForm] = useState({
        name: '', photo: '', fatherName: '', motherName: '',
        birthPlace: '', birthDate: '', originCountry: 'España',
        zone: 'Pabellón A · Hab. 101', medicalAlert: 'none', medicalDetails: ''

      const inputRef = useRef(null);
      const cameraInputRef = useRef(null);
      const galleryInputRef = useRef(null);

      // Persistencia automática
      useEffect(() => {
        try { localStorage.setItem(STORAGE_KEYS.MINORS, JSON.stringify(minors)); } catch (e) {}
      }, [minors]);
      useEffect(() => {
        try { localStorage.setItem(STORAGE_KEYS.RECORDS, JSON.stringify(records)); } catch (e) {}
      }, [records]);
      useEffect(() => {
        try { localStorage.setItem(STORAGE_KEYS.SYNC_QUEUE, JSON.stringify(syncQueue)); } catch (e) {}
      }, [syncQueue]);

      // Sincronización automática al recuperar conexión
      const syncPendingChanges = () => {
        const queue = JSON.parse(localStorage.getItem(STORAGE_KEYS.SYNC_QUEUE) || '[]');
        if (queue.length === 0) return;
        console.log(`[KODI SYNC] Sincronizando ${queue.length} cambios pendientes...`, queue);
        localStorage.setItem(STORAGE_KEYS.LAST_SYNC, new Date().toISOString());
        setSyncQueue([]);
      };

      const queueChange = (action, payload) => {
        const item = { id: `${Date.now()}-${Math.random().toString(36).substr(2,6)}`, action, payload, timestamp: new Date().toISOString() };
        setSyncQueue(prev => {
          const next = [...prev, item];
          if (navigator.onLine) setTimeout(syncPendingChanges, 500);
          return next;
        });
      };

      // Detectores de red
      useEffect(() => {
        const handleOnline = () => { setIsOnline(true); syncPendingChanges(); };
        const handleOffline = () => setIsOnline(false);
        window.addEventListener('online', handleOnline);
        window.addEventListener('offline', handleOffline);
        return () => { window.removeEventListener('online', handleOnline); window.removeEventListener('offline', handleOffline); };
      }, []);

      // Reloj institucional
      useEffect(() => {
        const updateClock = () => setCurrentTimeStr(new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
        updateClock();
        const iv = setInterval(updateClock, 1000);
        return () => clearInterval(iv);
      }, []);

      // Valores calculados
      const activeRecords = records[currentMode] || {};
      const registeredCount = Object.keys(activeRecords).length;
      const totalCount = minors.length;
      const pendingCount = Math.max(0, totalCount - registeredCount);
      const operatorInfo = `${currentUser.name} (${STAFF_ROLES.find(r => r.id === currentUser.role)?.label})`;

      // Compresión de foto con Canvas
      const processImageFile = (file) => {
        if (!file) return;
        setIsProcessingPhoto(true);
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const maxDim = 400;
            let w = img.width, h = img.height;
            if (w > h) { if (w > maxDim) { h = Math.round(h * maxDim / w); w = maxDim; } }
            else { if (h > maxDim) { w = Math.round(w * maxDim / h); h = maxDim; } }
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            setNewMinorForm(prev => ({ ...prev, photo: canvas.toDataURL('image/jpeg', 0.75) }));
            setIsProcessingPhoto(false);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      };

      const handlePhotoInput = (e) => { const f = e.target.files?.[0]; if (f) processImageFile(f); };

      // Escaneo o pulsación táctil
      const processScan = (rawCode) => {
        const code = (rawCode || '').trim().toUpperCase();
        if (!code) return;
        playAudioFeedback('beep');
        const found = minors.find(m =>
          m.id.toUpperCase() === code ||
          (m.wristband && m.wristband.toUpperCase() === code) ||
          m.name.toUpperCase().includes(code)
        );
        const timestampStr = new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        if (!found) {
          playAudioFeedback('error'); triggerHaptic([150, 80, 150]); setScreenFlash('red');
          setFeedback({ status: 'not_found', code, timestamp: timestampStr, message: `Código no registrado: "${code}"` });
          setTimeout(() => setScreenFlash(null), 400);
          setInputCode(''); return;
        }
        const previousRecord = activeRecords[found.id];
        if (previousRecord) {
          playAudioFeedback('duplicate'); triggerHaptic([250, 100, 250]); setScreenFlash('red');
          setFeedback({ status: 'duplicate', minor: found, timestamp: timestampStr, previousTime: previousRecord.timestamp, message: 'REGISTRO PREVIO EXISTENTE' });
          setTimeout(() => setScreenFlash(null), 500);
        } else {
          playAudioFeedback('success'); triggerHaptic([90]); setScreenFlash('green');
          const newRec = { timestamp: timestampStr, registeredBy: operatorInfo };
          setRecords(prev => ({ ...prev, [currentMode]: { ...prev[currentMode], [found.id]: newRec } }));
          queueChange('RECORD_ATTENDANCE', { mode: currentMode, minorId: found.id, record: newRec });
          setFeedback({ status: 'success', minor: found, timestamp: timestampStr, message: currentMode === 'moviles' ? 'Dispositivo verificado y registrado' : 'Acceso validado y registrado' });
          setTimeout(() => setScreenFlash(null), 500);
        }
        setInputCode('');
      };

      const handleToggleManual = (minorId) => {
        const isRegistered = !!activeRecords[minorId];
        const timestampStr = new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        if (isRegistered) {
          setRecords(prev => { const copy = { ...prev[currentMode] }; delete copy[minorId]; return { ...prev, [currentMode]: copy }; });
          queueChange('REMOVE_ATTENDANCE', { mode: currentMode, minorId });
        } else {
          const newRec = { timestamp: timestampStr, registeredBy: operatorInfo };
          setRecords(prev => ({ ...prev, [currentMode]: { ...prev[currentMode], [minorId]: newRec } }));
          queueChange('RECORD_ATTENDANCE', { mode: currentMode, minorId, record: newRec });
          playAudioFeedback('success');
        }
      };

      const handleResetSession = () => {
        const label = MODES.find(m => m.id === currentMode)?.label;

          setRecords(prev => ({ ...prev, [currentMode]: {} }));

      const handleSaveNewMinor = (e) => {
        e.preventDefault();
        if (!newMinorForm.name.trim()) { alert('Indica el nombre y apellidos del menor.'); return; }
        const nextIndex = minors.length + 1;
        const generatedId = `ID-${String(nextIndex).padStart(3, '0')}`;
        const generatedWristband = `PUL-${Math.floor(1000 + Math.random() * 9000)}`;
        const nameParts = newMinorForm.name.trim().split(' ');
        const initials = ((nameParts[0]?.[0] || 'X') + (nameParts[1]?.[0] || nameParts[0]?.[1] || 'M')).toUpperCase();
        let medicalData = null;
        if (newMinorForm.medicalAlert !== 'none') {
          medicalData = {
            hasAlert: true,
            type: newMinorForm.medicalAlert === 'celiac' ? 'Alergia Alimentaria' : newMinorForm.medicalAlert === 'nuts' ? 'Alerta Crítica' : newMinorForm.medicalAlert === 'halal' ? 'Dieta Cultural' : 'Condición Médica',
            title: newMinorForm.medicalAlert === 'celiac' ? 'CELÍACO ESTRICTO' : newMinorForm.medicalAlert === 'nuts' ? 'ALERGIA A FRUTOS SECOS' : newMinorForm.medicalAlert === 'halal' ? 'MENÚ HALAL' : 'ALERTA DIETÉTICA',
            description: newMinorForm.medicalDetails || 'Protocolo específico asignado.',
            severity: newMinorForm.medicalAlert === 'nuts' ? 'high' : 'medium'
          };
        }
        const newChild = {

                          <div>
                            <label className="text-[10px] font-bold text-slate-400 block mb-1">Lugar Nacimiento</label>
                            <input type="text" value={newMinorForm.birthPlace} onChange={e => setNewMinorForm(p => ({ ...p, birthPlace: e.target.value }))} placeholder="Ciudad" className="w-full bg-slate-900 border border-slate-800 text-white text-xs px-2.5 py-1.5 rounded-lg outline-none" />
                          </div>
                          <div>
                            <label className="text-[10px] font-bold text-slate-400 block mb-1">País</label>
                            <input type="text" value={newMinorForm.originCountry} onChange={e => setNewMinorForm(p => ({ ...p, originCountry: e.target.value }))} placeholder="España" className="w-full bg-slate-900 border border-slate-800 text-white text-xs px-2.5 py-1.5 rounded-lg outline-none" />
                          </div>
                        </div>
                      </div>
                    )}
                  </div>

                  <button type="submit" className="w-full py-3 bg-rose-600 hover:bg-rose-500 text-white font-bold text-sm uppercase tracking-wider rounded-xl transition-all shadow-md active:scale-98">
                    Guardar Menor
                  </button>
                </form>
              </main>
            </div>
          )}

          {/* ══════════════════════════════════════ */}
          {/* PANTALLA 5: RECUENTO                  */}
          {/* ══════════════════════════════════════ */}
          {navScreen === 'recount' && (
            <div className="flex-1 flex flex-col">

              {/* Header del recuento */}
              <header className="bg-slate-900/95 backdrop-blur-md border-b border-slate-800 sticky top-0 z-40 px-3.5 pt-3 pb-2.5 shadow-md">
                <div className="flex items-center justify-between mb-2">
                  <button type="button" onClick={() => setNavScreen('menu')} className="text-xs font-bold text-blue-400 hover:text-blue-300 flex items-center gap-1 bg-slate-950 px-2.5 py-1.5 rounded-lg border border-slate-800">← Panel</button>
                  <div className="text-center">
                    <span className="font-extrabold text-sm text-white block">Recuento</span>
                    <span className="text-[10px] font-mono text-slate-400">{registeredCount}/{totalCount} · {operatorInfo}</span>
                  </div>
                  <span className="font-mono text-xs text-slate-400 bg-slate-950 px-2 py-1 rounded border border-slate-800">{currentTimeStr}</span>
                </div>

                {/* Selector de turnos */}
                <div className="flex gap-1.5 overflow-x-auto no-scrollbar pb-1">
                  {MODES.map(m => {
                    const isActive = m.id === currentMode;
                    return (
                      <button
                        key={m.id}
                        type="button"
                        onClick={() => { setCurrentMode(m.id); setFeedback(null); }}
                        className={`flex-shrink-0 px-3 py-1.5 rounded-lg text-xs font-semibold transition-all ${isActive ? 'bg-blue-600 text-white font-bold shadow-sm' : 'bg-slate-950 text-slate-400 hover:text-slate-200 border border-slate-800/80'}`}
                      >
                        {m.label}
                      </button>
                    );
                  })}
                </div>
              </header>

              {/* Barra de tabs Lector / Resumen */}
              <div className="bg-slate-950 border-b border-slate-800 px-3.5 py-2 flex gap-2">
                <button type="button" onClick={() => setCurrentView('scan')} className={`flex-1 py-1.5 rounded-lg text-xs font-bold transition-all ${currentView === 'scan' ? 'bg-blue-600 text-white' : 'text-slate-400 bg-slate-900 border border-slate-800'}`}>Lector / Entrada</button>
                <button type="button" onClick={() => setCurrentView('summary')} className={`flex-1 py-1.5 rounded-lg text-xs font-bold transition-all relative ${currentView === 'summary' ? 'bg-blue-600 text-white' : 'text-slate-400 bg-slate-900 border border-slate-800'}`}>
                  Resumen ({registeredCount})
                  {registeredCount > 0 && <span className="absolute top-1.5 right-2.5 w-1.5 h-1.5 rounded-full bg-emerald-400"></span>}
                </button>
              </div>

              <main className="flex-1 px-3.5 py-3 overflow-y-auto space-y-3 pb-6">

                {/* ── VISTA LECTOR ── */}
                {currentView === 'scan' && (
                  <div className="space-y-3">
                    {/* Input de escaneo */}
                    <div className="bg-slate-900 border border-slate-800 rounded-xl p-3 shadow-sm">
                      <div className="flex items-center justify-between mb-1.5">
                        <span className="text-[11px] font-bold uppercase tracking-wider text-slate-300">Lector de Pulsera</span>
                        <span className="text-[10px] text-slate-500 font-mono">HID / Teclado</span>
                      </div>
                      <form onSubmit={e => { e.preventDefault(); processScan(inputCode); }} className="relative">
                        <input
                          ref={inputRef}
                          type="text"
                          value={inputCode}
                          onChange={e => setInputCode(e.target.value)}
                          placeholder="Pasa la pulsera o escribe el ID..."
                          className="w-full bg-slate-950 border border-slate-800 focus:border-blue-500 text-white font-mono text-sm px-3.5 py-3 rounded-lg outline-none placeholder:text-slate-500 pr-24"
                          autoComplete="off" autoCapitalize="characters" spellCheck="false"
                        />
                        {inputCode && (
                          <button type="button" onClick={() => setInputCode('')} className="absolute right-20 top-2.5 text-slate-400 hover:text-white p-1 text-xs">✕</button>
                        )}
                        <button type="submit" className="absolute right-1.5 top-1.5 bottom-1.5 bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs uppercase px-3 rounded-md transition-colors shadow-sm">Validar</button>
                      </form>

                      {/* Fichado rápido táctil con menores reales */}
                      {minors.length > 0 && (
                        <div className="mt-3 pt-2.5 border-t border-slate-800">
                          <span className="text-[11px] font-semibold text-slate-400 block mb-1.5">Fichado rápido:</span>
                          <div className="grid grid-cols-3 gap-1.5">
                            {minors.slice(0, 3).map(km => (
                              <button key={km.id} type="button" onClick={() => processScan(km.id)} className="p-2 rounded-lg bg-slate-950 border border-slate-800 hover:border-blue-500 text-left transition-all active:scale-95">
                                <div className="text-[10px] font-mono font-bold text-slate-400">{km.wristband || km.id}</div>
                                <div className="text-xs font-semibold text-slate-200 truncate">{km.name.split(' ')[0]}</div>
                                <div className="text-[9px] text-slate-500 font-mono mt-0.5 truncate">{km.zone}</div>
                              </button>
                            ))}
                          </div>
                        </div>
                      )}
                    </div>

                    {/* Tarjeta de feedback */}
                    {feedback ? (
                      <div className={`rounded-xl border p-4 shadow-lg ${feedback.status === 'success' ? 'bg-slate-900 border-emerald-500/80' : feedback.status === 'duplicate' ? 'bg-slate-900 border-rose-500/80' : 'bg-slate-900 border-amber-500/80'}`}>
                        <div className="flex items-center justify-between mb-2">
                          <span className={`text-xs font-bold uppercase tracking-wider ${feedback.status === 'success' ? 'text-emerald-400' : feedback.status === 'duplicate' ? 'text-rose-400' : 'text-amber-400'}`}>
                            {feedback.status === 'success' ? '✓ Acceso validado' : feedback.status === 'duplicate' ? '⚠ Registro duplicado' : '✕ No encontrado'}
                          </span>
                          <span className="text-[10px] font-mono text-slate-500">{feedback.timestamp}</span>
                        </div>

                        {feedback.minor && (
                          <div className="bg-slate-950 rounded-lg p-3 border border-slate-800">
                            <div className="flex items-center gap-2.5 mb-2">
                              {feedback.minor.photo
                                ? <img src={feedback.minor.photo} alt={feedback.minor.name} className="w-12 h-12 rounded-xl object-cover border border-slate-700 flex-shrink-0" />
                                : <div className="w-10 h-10 rounded-lg bg-slate-800 text-white flex items-center justify-center font-mono font-bold text-xs border border-slate-700 flex-shrink-0">{feedback.minor.initials}</div>
                              }
                              <div>
                                <div className="flex items-center gap-1.5">
                                  <span className="font-mono text-[10px] font-bold text-blue-400 bg-blue-500/10 px-1 py-0.2 rounded border border-blue-500/20">{feedback.minor.id}</span>
                                  <span className="text-[10px] font-mono text-slate-400">{feedback.minor.wristband}</span>
                                </div>
                                <h4 className="text-sm font-bold text-white mt-0.5">{feedback.minor.name}</h4>
                                <p className="text-[11px] text-slate-400">{feedback.minor.age} años · {feedback.minor.zone}</p>
                              </div>
                            </div>
                            {feedback.minor.medical && (
                              <div className="p-2.5 rounded-lg border border-amber-500/50 bg-amber-500/10 text-amber-200">
                                <span className="text-[9px] font-bold uppercase tracking-wider bg-amber-500 text-slate-950 px-1 py-0.2 rounded font-mono">{feedback.minor.medical.type}</span>
                                <h5 className="font-bold text-xs text-amber-300 mt-0.5">{feedback.minor.medical.title}</h5>
                                <p className="text-[11px] text-amber-200/90 mt-0.5">{feedback.minor.medical.description}</p>
                              </div>
                            )}
                            {feedback.status === 'duplicate' && feedback.previousTime && (
                              <p className="text-[11px] text-rose-300 mt-2">Ya registrado a las {feedback.previousTime}</p>
                            )}
                          </div>
                        )}

                        {feedback.status === 'not_found' && (
                          <p className="text-sm text-amber-300 font-mono">{feedback.message}</p>
                        )}

                        <button type="button" onClick={() => setFeedback(null)} className="w-full mt-3 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs font-semibold text-slate-200 border border-slate-700 transition-colors">
                          Continuar escaneo
                        </button>
                      </div>
                    ) : (
                      <div className="flex-1 flex flex-col items-center justify-center p-6 text-center bg-slate-900/40 rounded-xl border border-dashed border-slate-800">
                        <div className="w-10 h-10 rounded-lg bg-slate-800/60 border border-slate-700 flex items-center justify-center text-slate-300 font-mono text-sm mb-2.5">RF</div>
                        <h3 className="text-sm font-semibold text-slate-200">Listo para lectura</h3>
                        <p className="text-xs text-slate-400 mt-1">Acerca el lector a la pulsera del residente.</p>
                      </div>
                    )}
                  </div>
                )}

                {/* ── VISTA RESUMEN ── */}
                {currentView === 'summary' && (
                  <div className="space-y-3">
                    {/* KPIs */}
                    <div className="grid grid-cols-3 gap-2">
                      <button type="button" onClick={() => setSummaryFilter('all')} className={`p-2.5 rounded-xl border text-center transition-all ${summaryFilter === 'all' ? 'bg-slate-800 border-blue-500 ring-2 ring-blue-500/30' : 'bg-slate-900 border-slate-800 hover:border-slate-700'}`}>
                        <span className="text-[10px] uppercase font-bold text-slate-400 block">Total</span>
                        <p className="text-lg font-black text-white font-mono mt-0.5">{totalCount}</p>
                      </button>
                      <button type="button" onClick={() => setSummaryFilter('passed')} className={`p-2.5 rounded-xl border text-center transition-all ${summaryFilter === 'passed' ? 'bg-emerald-950/60 border-emerald-500 ring-2 ring-emerald-500/30' : 'bg-slate-900 border-slate-800 hover:border-emerald-500/40'}`}>
                        <span className="text-[10px] uppercase font-bold text-emerald-400 block">Fichados</span>
                        <p className="text-lg font-black text-emerald-400 font-mono mt-0.5">{registeredCount}</p>
                      </button>
                      <button type="button" onClick={() => setSummaryFilter('pending')} className={`p-2.5 rounded-xl border text-center transition-all ${summaryFilter === 'pending' ? 'bg-rose-950/60 border-rose-500 ring-2 ring-rose-500/30' : 'bg-slate-900 border-slate-800 hover:border-rose-500/40'}`}>
                        <span className="text-[10px] uppercase font-bold text-rose-400 block">Pendientes</span>
                        <p className="text-lg font-black text-rose-400 font-mono mt-0.5">{pendingCount}</p>
                      </button>
                    </div>

                    {/* Buscador */}
                    <div className="relative">
                      <input type="text" value={searchQuery} onChange={e => setSearchQuery(e.target.value)} placeholder="Buscar por nombre, zona o alergia..." className="w-full bg-slate-950 border border-slate-700 text-xs rounded-lg px-3 py-2 text-white placeholder:text-slate-500 focus:outline-none focus:border-blue-500" />
                      {searchQuery && <button type="button" onClick={() => setSearchQuery('')} className="absolute right-2.5 top-2 text-slate-400 hover:text-white text-xs">✕</button>}
                    </div>

                    {/* Filtro alergias */}
                    <div className="flex justify-end">
                      <button type="button" onClick={() => setSummaryFilter(summaryFilter === 'allergies' ? 'all' : 'allergies')} className={`text-[10px] font-bold px-2 py-0.5 rounded border transition-colors ${summaryFilter === 'allergies' ? 'bg-amber-500 text-slate-950 border-amber-400' : 'bg-slate-800 text-amber-300 border-amber-500/30'}`}>
                        Dietas / Alergias
                      </button>
                    </div>

                    {/* Lista de menores en resumen */}
                    <div className="space-y-1.5">
                      {minors.filter(m => {
                        const isReg = !!activeRecords[m.id];
                        if (summaryFilter === 'passed' && !isReg) return false;
                        if (summaryFilter === 'pending' && isReg) return false;
                        if (summaryFilter === 'allergies' && !m.medical) return false;
                        if (!searchQuery) return true;
                        const q = searchQuery.toLowerCase();
                        return m.name.toLowerCase().includes(q) || m.id.toLowerCase().includes(q) || (m.zone && m.zone.toLowerCase().includes(q)) || (m.medical && m.medical.title.toLowerCase().includes(q));
                      }).map(kid => {
                        const record = activeRecords[kid.id];
                        const isReg = !!record;
                        return (
                          <div key={kid.id} className={`p-2.5 rounded-lg border transition-all ${isReg ? 'bg-slate-900/80 border-emerald-500/40' : 'bg-slate-900/40 border-slate-800'}`}>
                            <div className="flex items-center justify-between">
                              <div className="flex items-center gap-2.5 truncate mr-2">
                                {kid.photo
                                  ? <img src={kid.photo} alt={kid.name} className="w-8 h-8 rounded-lg object-cover border border-slate-700 flex-shrink-0" />
                                  : <div className="w-8 h-8 rounded bg-slate-800 text-slate-200 flex-shrink-0 flex items-center justify-center font-mono font-bold text-[11px] border border-slate-700">{kid.initials}</div>
                                }
                                <div className="truncate">
                                  <div className="flex items-center gap-1.5">
                                    <span className="font-mono text-[9px] font-bold text-slate-400 bg-slate-800 px-1 py-0.2 rounded">{kid.id}</span>
                                    <h4 className="font-bold text-xs text-white truncate">{kid.name}</h4>
                                  </div>
                                  <p className="text-[10px] text-slate-400 truncate mt-0.5">{kid.zone} · {kid.monitor}</p>
                                </div>
                              </div>
                              <button type="button" onClick={() => handleToggleManual(kid.id)} className={`px-2.5 py-1 rounded text-xs font-bold transition-all flex-shrink-0 ${isReg ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 hover:bg-emerald-500/30' : 'bg-slate-800 text-slate-300 hover:bg-slate-700 border border-slate-700'}`}>
                                {isReg ? '✓' : '+'}
                              </button>
                            </div>
                            {kid.medical && (
                              <div className="mt-1.5 pt-1 border-t border-slate-800/80 flex items-center gap-1 text-[10px] font-semibold text-amber-300">
                                <span className="w-1.5 h-1.5 rounded-full bg-amber-400 flex-shrink-0"></span>
                                <span className="truncate">{kid.medical.title}</span>
                              </div>
                            )}
                            {isReg && record?.timestamp && (
                              <div className="mt-1 text-[9px] font-mono text-emerald-400/80 text-right">Registrado {record.timestamp}</div>
                            )}
                          </div>
                        );
                      })}
                    </div>

                    {/* Acciones */}
                    <div className="pt-2 flex items-center gap-2">
                      <button type="button" onClick={handleResetSession} className="flex-1 py-2 px-3 rounded-lg bg-rose-950/30 hover:bg-rose-900/40 text-rose-300 text-xs font-semibold border border-rose-800/40 transition-colors">
                        Reiniciar {MODES.find(m => m.id === currentMode)?.label}
                      </button>
                      <button type="button" onClick={() => alert(`Turno ${MODES.find(m => m.id === currentMode)?.label}: ${registeredCount} fichados, ${pendingCount} pendientes de ${totalCount}.`)} className="py-2 px-3 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold border border-slate-700">
                        Exportar
                      </button>
                    </div>
                  </div>
                )}
              </main>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
