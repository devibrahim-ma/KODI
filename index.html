    // Web Audio API Synthesizer (Zero-latency institutional beeps)
    const playAudioFeedback = (type) => {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();

        if (type === 'success') {
          // Double harmonic chime (High confidence)
          const now = ctx.currentTime;
          const osc1 = ctx.createOscillator();
          const gain1 = ctx.createGain();
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(659.25, now); // E5
          osc1.frequency.exponentialRampToValueAtTime(880, now + 0.1); // A5
          gain1.gain.setValueAtTime(0.2, now);
          gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          osc1.connect(gain1);
          gain1.connect(ctx.destination);
          osc1.start(now);
          osc1.stop(now + 0.22);

          const osc2 = ctx.createOscillator();
          const gain2 = ctx.createGain();
          osc2.type = 'triangle';
          osc2.frequency.setValueAtTime(880, now + 0.1);
          osc2.frequency.exponentialRampToValueAtTime(1318.5, now + 0.3); // E6
          gain2.gain.setValueAtTime(0.18, now + 0.1);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc2.connect(gain2);
          gain2.connect(ctx.destination);
          osc2.start(now + 0.1);
          osc2.stop(now + 0.35);
        } else if (type === 'duplicate' || type === 'error') {
          // Low reject pulse
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(240, now);
          osc.frequency.setValueAtTime(180, now + 0.12);
          gain.gain.setValueAtTime(0.28, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.38);
        } else if (type === 'beep') {
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1174.66, now);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.06);
        }
      } catch (e) {}
    };

      // Sincronización automática al recuperar la conexión
      const syncPendingChanges = () => {
        const queue = JSON.parse(localStorage.getItem(STORAGE_KEYS.SYNC_QUEUE) || '[]');
        if (queue.length === 0) return;
        console.log(`[KODI OFFLINE SYNC] Sincronizando ${queue.length} cambios pendientes con la BBDD...`, queue);
        const now = new Date().toISOString();
        localStorage.setItem(STORAGE_KEYS.LAST_SYNC, now);
        setSyncQueue([]);
      };

      const queueChange = (action, payload) => {
        const item = {
          id: `${Date.now()}-${Math.random().toString(36).substr(2, 6)}`,
          action,
          payload,
          timestamp: new Date().toISOString()
        };
        setSyncQueue(prev => {
          const next = [...prev, item];
          if (navigator.onLine) {
            setTimeout(syncPendingChanges, 500);
          }
          return next;
        });
      };

      // Detectores de red
      useEffect(() => {
        const handleOnline = () => {
          setIsOnline(true);
          syncPendingChanges();
        };
        const handleOffline = () => setIsOnline(false);
        window.addEventListener('online', handleOnline);
        window.addEventListener('offline', handleOffline);
        return () => {
          window.removeEventListener('online', handleOnline);
          window.removeEventListener('offline', handleOffline);
        };

      // Compresión client-side de foto a canvas JPEG ligero (~30KB)
      const processImageFile = (file) => {
        if (!file) return;
        setIsProcessingPhoto(true);
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const maxDim = 400;
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > maxDim) {
                height = Math.round((height * maxDim) / width);
                width = maxDim;
              }
            } else {
              if (height > maxDim) {
                width = Math.round((width * maxDim) / height);
                height = maxDim;
              }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            const compressed = canvas.toDataURL('image/jpeg', 0.75);
            setNewMinorForm(prev => ({ ...prev, photo: compressed }));
            setIsProcessingPhoto(false);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      };

                                  ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 hover:bg-emerald-500/30'
                                  : 'bg-slate-800 text-slate-300 hover:bg-slate-700 border border-slate-700'
                              }`}
                            >
                              <div className="flex items-center justify-between">
                                <div className="flex items-center space-x-2.5 truncate mr-2">
                                  {kid.photo ? (
                                    <img
                                      src={kid.photo}
                                      alt={kid.name}
                                      className="w-8 h-8 rounded-lg object-cover border border-samu-navy-700 flex-shrink-0"
                                    />
                                  ) : (
                                    <div className="w-8 h-8 rounded bg-samu-navy-850 text-white flex-shrink-0 flex items-center justify-center font-mono font-bold text-[11px] border border-samu-navy-700">
                                      {kid.initials}
                                    </div>
                                  )}
                                  <div className="truncate">
                                    <div className="flex items-center space-x-1.5">
                                      <span className="font-mono text-[9px] font-bold text-slate-300 bg-samu-navy-950 px-1 py-0.2 rounded border border-samu-navy-800">
                                        {kid.id}
                                      </span>
                                      <h4 className="font-bold text-xs text-white truncate">
                                        {kid.name}
                                      </h4>
                                    </div>
                                    <p className="text-[10px] text-slate-400 truncate mt-0.5">
                                      {kid.zone} · {kid.originCountry || 'España'}
                                    </p>
                                  </div>
                                </div>

                          {kid.medical && (
                            <div className="mt-1.5 pt-1 border-t border-slate-800/80 flex items-center space-x-1 text-[10px] font-semibold text-amber-300">
                              <span className="w-1.5 h-1.5 rounded-full bg-amber-400 flex-shrink-0"></span>
                              <span className="truncate">{kid.medical.title}</span>
                            </div>
                          )}

                          {isReg && record.timestamp && (
                            <div className="mt-1 text-[9px] font-mono text-emerald-400/80 text-right">
                              Registrado a las {record.timestamp}
                            </div>
                          )}
                        </div>
                      );
                    })}
                </div>

                {/* ACCIONES DE CIERRE Y REINICIO */}
                <div className="pt-2 flex items-center gap-2">
                  <button
                    type="button"
                    onClick={handleResetSession}
                    className="flex-1 py-2 px-3 rounded-lg bg-rose-950/30 hover:bg-rose-900/40 text-rose-300 text-xs font-semibold border border-rose-800/40 transition-colors"
                  >
                    Reiniciar {MODES.find(m => m.id === currentMode)?.label}
                  </button>

                  <button
                    type="button"
                    onClick={() => {
                      alert(`Informe del turno ${MODES.find(m => m.id === currentMode)?.label}:\nRegistrados: ${registeredCount}\nPendientes: ${pendingCount}\nTotal: ${totalCount}`);
                    }}
                    className="py-2 px-3 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold border border-slate-700"
                  >
                    Exportar
                  </button>
                </div>
              </div>
            )}
          </main>

          {/* BARRA INFERIOR DE NAVEGACIÓN */}
          <nav className="fixed bottom-0 left-0 right-0 bg-slate-950/95 backdrop-blur-lg border-t border-slate-800 px-6 py-2 z-50 max-w-md mx-auto">
            <div className="grid grid-cols-2 gap-3">
              <button
                type="button"
                onClick={() => setCurrentView('scan')}
                className={`py-2 px-3 rounded-lg text-xs font-bold transition-all text-center ${
                  currentView === 'scan'
                    ? 'bg-blue-600 text-white shadow-sm'
                    : 'text-slate-400 hover:text-slate-200 bg-slate-900/60 border border-slate-800'
                }`}
              >
                Lector / Entrada
              </button>

              <button
                type="button"
                onClick={() => setCurrentView('summary')}
                className={`py-2 px-3 rounded-lg text-xs font-bold transition-all text-center relative ${
                  currentView === 'summary'
                    ? 'bg-blue-600 text-white shadow-sm'
                    : 'text-slate-400 hover:text-slate-200 bg-slate-900/60 border border-slate-800'
                }`}
              >
                <span>Resumen ({registeredCount})</span>
                {registeredCount > 0 && (
                  <span className="absolute top-1.5 right-3 w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                )}
              </button>
            </div>
          </nav>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
